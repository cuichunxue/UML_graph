        if (isSeq()) return renderSeqPanel();
        if (selNodes.size >= 2) {                  // 複数選択 → 整列パネル
            props.innerHTML = `<h3>複数選択（${selNodes.size}件）</h3>
                <div class="field"><label>整列</label>
                  <div class="tool-grid">
                    <button class="tool" data-align="left">左揃え</button>
                    <button class="tool" data-align="hcenter">左右中央</button>
                    <button class="tool" data-align="right">右揃え</button>
                    <button class="tool" data-align="top">上揃え</button>
                    <button class="tool" data-align="vcenter">上下中央</button>
                    <button class="tool" data-align="bottom">下揃え</button>
                    <button class="tool" data-align="hdist">水平等間隔</button>
                    <button class="tool" data-align="vdist">垂直等間隔</button>
                  </div>
                </div>
                <button class="btn" id="m_dup" style="width:100%;margin-bottom:8px"><span class="ico">⧉</span> 複製 (Ctrl+D)</button>
                <button class="btn danger" id="m_del" style="width:100%"><span class="ico">🗑</span> ${selNodes.size}件を削除</button>`;
            props.querySelectorAll('[data-align]').forEach(b => b.onclick = () => align(b.dataset.align));
            $('m_dup').onclick = duplicateSelection;
            $('m_del').onclick = deleteSelection;
            return;
        }
        if (!selection) {
            props.innerHTML = `<h3>使い方</h3><div class="empty-hint">
                ・上の<b>図の種類</b>でクラス/状態/ユースケース/コンポーネントを切替<br>
                ・左の<b>ツール</b>でノードを選んでキャンバスをクリック（空白ダブルクリックでも可）<br>
                ・<b>関連線</b>はノードからノードへドラッグ<br>
                ・<kbd>Shift</kbd>+クリック / ドラッグで<b>複数選択</b><br>
                ・<kbd>Ctrl+D</kbd> 複製 / <kbd>Ctrl+C/V</kbd> コピペ<br>
                ・<kbd>Delete</kbd> 削除 / <kbd>Ctrl+Z</kbd> 取消<br>
                ・<b>&lt;/&gt;テキスト</b>でPlantUML風コードを双方向編集</div>`;
            return;
        }
        if (selection.kind === 'node') {
            const n = nodeById(selection.id); if (!n) { select(null); return; }
            const kind = n.kind || 'class';
            const delBtn = `<button class="btn danger" id="f_del" style="width:100%"><span class="ico">🗑</span> 削除</button>`;
            if (kind === 'initial' || kind === 'final') {
                props.innerHTML = `<h3>${NODE_LABEL[kind]}状態</h3><div class="empty-hint" style="margin-bottom:10px">${kind === 'initial' ? '開始疑似状態' : '終了状態'}（編集項目なし）</div>${delBtn}`;
                $('f_del').onclick = deleteSelection;
            } else if (kind === 'class') {
                props.innerHTML = `<h3>クラス</h3>
                    <div class="field"><label>クラス名</label><input id="f_name" value="${esc(n.name)}"></div>
                    <div class="field"><label>ステレオタイプ（任意）</label><input id="f_stereo" value="${esc(n.stereotype || '')}" placeholder="interface, abstract …"></div>
                    <div class="field"><label>属性（1行に1つ）</label><textarea id="f_attrs" placeholder="- name: String">${esc((n.attributes || []).join('\n'))}</textarea></div>
                    <div class="field"><label>操作（1行に1つ）</label><textarea id="f_methods" placeholder="+ getName(): String">${esc((n.methods || []).join('\n'))}</textarea></div>${delBtn}`;
                const upd = () => { n.name = $('f_name').value; n.stereotype = $('f_stereo').value.trim(); n.attributes = lines($('f_attrs').value); n.methods = lines($('f_methods').value); render(); };
                $('f_name').oninput = $('f_stereo').oninput = $('f_attrs').oninput = $('f_methods').oninput = upd;
                ['f_name', 'f_stereo', 'f_attrs', 'f_methods'].forEach(id => $(id).addEventListener('change', () => { recordEdit(); save(); }));
                $('f_del').onclick = deleteSelection;
            } else if (kind === 'note') {
                props.innerHTML = `<h3>ノート</h3>
                    <div class="field"><label>本文</label><textarea id="f_text" placeholder="メモ・注釈">${esc(n.text || '')}</textarea></div>${delBtn}`;
                $('f_text').oninput = () => { n.text = $('f_text').value; render(); };
                $('f_text').addEventListener('change', () => { recordEdit(); save(); });
                $('f_del').onclick = deleteSelection;
            } else if (kind === 'boundary') {
                props.innerHTML = `<h3>境界</h3>
                    <div class="field"><label>名前</label><input id="f_name" value="${esc(n.name)}"></div>
                    <div class="field"><label>幅</label><input id="f_w" type="number" value="${Math.round(n.w)}"></div>
                    <div class="field"><label>高さ</label><input id="f_h" type="number" value="${Math.round(n.h)}"></div>${delBtn}`;
                const upd = () => { n.name = $('f_name').value; n.w = Math.max(120, +$('f_w').value || 120); n.h = Math.max(80, +$('f_h').value || 80); render(); };
                $('f_name').oninput = $('f_w').oninput = $('f_h').oninput = upd;
                ['f_name', 'f_w', 'f_h'].forEach(id => $(id).addEventListener('change', () => { recordEdit(); save(); }));
                $('f_del').onclick = deleteSelection;
            } else {
                props.innerHTML = `<h3>${NODE_LABEL[kind] || 'ノード'}</h3>
                    <div class="field"><label>名前</label><input id="f_name" value="${esc(n.name)}"></div>${delBtn}`;
                const upd = () => { n.name = $('f_name').value; render(); };
                $('f_name').oninput = upd;
                $('f_name').addEventListener('change', () => { recordEdit(); save(); });
                $('f_del').onclick = deleteSelection;
            }
        } else {
            const e = edgeById(selection.id); if (!e) { select(null); return; }
            const allowed = new Set(DIAGRAMS[diagramType()].rels.concat([e.type]));
            const opts = Object.entries(REL).filter(([k]) => allowed.has(k)).map(([k, v]) => `<option value="${k}" ${k === e.type ? 'selected' : ''}>${v.label}</option>`).join('');
            const a = nodeById(e.from), b = nodeById(e.to);
            props.innerHTML = `<h3>関連</h3>
                <div class="field"><label>種類</label><select id="f_type">${opts}</select></div>
                <div class="field"><label>多重度（${esc(a ? a.name : '?')}側）</label><input id="f_fmult" value="${esc(e.fromMult || '')}" placeholder="1, 0..*, *"></div>
                <div class="field"><label>多重度（${esc(b ? b.name : '?')}側）</label><input id="f_tmult" value="${esc(e.toMult || '')}" placeholder="1, 0..*, *"></div>
                <div class="field"><label>ラベル（任意）</label><input id="f_label" value="${esc(e.label || '')}" placeholder="uses, owns …"></div>
                <button class="btn" id="f_swap" style="width:100%;margin-bottom:8px"><span class="ico">⇄</span> 向きを反転</button>
                <button class="btn danger" id="f_del" style="width:100%"><span class="ico">🗑</span> この関連を削除</button>`;
            const upd = () => { e.type = $('f_type').value; e.fromMult = $('f_fmult').value.trim();
                e.toMult = $('f_tmult').value.trim(); e.label = $('f_label').value.trim(); render(); };
            $('f_type').onchange = () => { upd(); recordEdit(); save(); };
            $('f_fmult').oninput = $('f_tmult').oninput = $('f_label').oninput = upd;
            ['f_fmult','f_tmult','f_label'].forEach(id => $(id).addEventListener('change', () => { recordEdit(); save(); }));
            $('f_swap').onclick = () => { commit(); [e.from, e.to] = [e.to, e.from]; [e.fromMult, e.toMult] = [e.toMult, e.fromMult]; render(); renderPanel(); save(); };
            $('f_del').onclick = deleteSelection;
        }
    }
    function lines(s) { return s.split('\n').map(x => x.trimEnd()).filter(x => x.trim() !== ''); }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    const FRAG_TYPES = ['opt', 'loop', 'alt', 'par', 'break', 'critical'];
    function renderSeqPanel() {
        const delBtn = `<button class="btn danger" id="f_del" style="width:100%"><span class="ico">🗑</span> 削除</button>`;
        const fragBtn = `<button class="btn" id="f_addfrag" style="width:100%;margin-top:10px"><span class="ico">▭</span> フラグメント追加 (alt/loop/opt)</button>`;
        const pn = id => { const p = (state.participants || []).find(o => o.id === id); return p ? p.name : '?'; };
        const msgOpts = (sel) => (state.messages || []).map((m, i) => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${i + 1}. ${esc(m.text || (pn(m.from) + '→' + pn(m.to)))}</option>`).join('');

        if (!selection) {
            props.innerHTML = `<h3>使い方</h3><div class="empty-hint">
                ・<b>ライフライン/アクター</b>でキャンバスをクリックして追加<br>
                ・<b>同期/非同期/応答</b>を選び、ライフライン間をドラッグでメッセージ追加<br>
                ・メッセージは上から時間順。選択して▲▼で並べ替え<br>
                ・同じライフラインへドラッグで自己メッセージ<br>
                ・同期呼び出し→応答 で<b>実行仕様バー</b>を自動表示</div>${fragBtn}`;
            $('f_addfrag').onclick = addFragment;

        if (selection.kind === 'snote') {

            props.innerHTML = `<h3>ノート</h3>
                <div class="field"><label>本文</label><textarea id="f_text" placeholder="メモ・注釈">${esc(nt.text || '')}</textarea></div>${delBtn}`;
            $('f_text').oninput = () => { nt.text = $('f_text').value; render(); };
            $('f_text').addEventListener('change', () => { recordEdit(); save(); });
            $('f_del').onclick = deleteSelection;

        }
        if (selection.kind === 'part') {
            const p = state.participants.find(o => o.id === selection.id); if (!p) { select(null); return; }
            props.innerHTML = `<h3>ライフライン</h3>
                <div class="field"><label>名前</label><input id="f_name" value="${esc(p.name)}"></div>
                <div class="field"><label>種類</label><select id="f_kind">
                    <option value="participant" ${p.kind !== 'actor' ? 'selected' : ''}>オブジェクト（四角）</option>
                    <option value="actor" ${p.kind === 'actor' ? 'selected' : ''}>アクター（棒人間）</option></select></div>
                <div class="field"><label>並び替え</label><div class="tool-grid">
                    <button class="tool" id="f_left">◀ 左へ</button><button class="tool" id="f_right">右へ ▶</button></div></div>${delBtn}`;
            $('f_name').oninput = () => { p.name = $('f_name').value; render(); };
            $('f_name').addEventListener('change', () => { recordEdit(); save(); });
            $('f_kind').onchange = () => { p.kind = $('f_kind').value; recordEdit(); render(); save(); };
            $('f_left').onclick = () => moveItem(state.participants, p.id, -1);
            $('f_right').onclick = () => moveItem(state.participants, p.id, 1);
            $('f_del').onclick = deleteSelection;
        } else if (selection.kind === 'frag') {
            const f = (state.fragments || []).find(o => o.id === selection.id); if (!f) { select(null); return; }
            const tOpts = FRAG_TYPES.map(k => `<option value="${k}" ${k === f.type ? 'selected' : ''}>${k}</option>`).join('');
            const elseBlock = f.type === 'alt' ? `
                <div class="field"><label>else 位置（このメッセージの後）</label><select id="f_else"><option value="">なし</option>${msgOpts(f.elseAfter)}</select></div>
                <div class="field"><label>else 条件</label><input id="f_elsel" value="${esc(f.elseLabel || '')}" placeholder="それ以外"></div>` : '';
            props.innerHTML = `<h3>複合フラグメント</h3>
                <div class="field"><label>種類</label><select id="f_type">${tOpts}</select></div>
                <div class="field"><label>条件 / ガード</label><input id="f_label" value="${esc(f.label || '')}" placeholder="x > 0, 成功時 …"></div>
                <div class="field"><label>開始メッセージ</label><select id="f_from">${msgOpts(f.from)}</select></div>
                <div class="field"><label>終了メッセージ</label><select id="f_to">${msgOpts(f.to)}</select></div>
                ${elseBlock}${delBtn}`;
            const upd = () => { f.type = $('f_type').value; f.label = $('f_label').value; f.from = $('f_from').value; f.to = $('f_to').value;
                if ($('f_else')) f.elseAfter = $('f_else').value; if ($('f_elsel')) f.elseLabel = $('f_elsel').value; render(); };
            $('f_type').onchange = () => { upd(); recordEdit(); renderPanel(); save(); };
            $('f_from').onchange = $('f_to').onchange = () => { upd(); recordEdit(); save(); };
            $('f_label').oninput = upd; $('f_label').addEventListener('change', () => { recordEdit(); save(); });
            if ($('f_else')) $('f_else').onchange = () => { upd(); recordEdit(); save(); };
            if ($('f_elsel')) { $('f_elsel').oninput = upd; $('f_elsel').addEventListener('change', () => { recordEdit(); save(); }); }
            $('f_del').onclick = deleteSelection;
        } else {
            const m = state.messages.find(o => o.id === selection.id); if (!m) { select(null); return; }
            const opts = ['sync', 'async', 'reply'].map(k => `<option value="${k}" ${k === m.type ? 'selected' : ''}>${REL[k].label}</option>`).join('');
            props.innerHTML = `<h3>メッセージ</h3>
                <div class="field"><label>本文</label><input id="f_text" value="${esc(m.text || '')}" placeholder="メソッド名 / 内容"></div>
                <div class="field"><label>種類</label><select id="f_type">${opts}</select></div>
                <div class="field"><label>向き</label><div class="empty-hint">${esc(pn(m.from))} → ${esc(pn(m.to))}</div></div>
                <button class="btn" id="f_swap" style="width:100%;margin-bottom:8px"><span class="ico">⇄</span> 送受信を反転</button>
                <div class="field"><label>並び替え（時間順）</label><div class="tool-grid">
                    <button class="tool" id="f_up">▲ 上へ</button><button class="tool" id="f_down">▼ 下へ</button></div></div>${delBtn}${fragBtn}`;
            $('f_text').oninput = () => { m.text = $('f_text').value; render(); };
            $('f_text').addEventListener('change', () => { recordEdit(); save(); });
            $('f_type').onchange = () => { m.type = $('f_type').value; recordEdit(); render(); save(); };
            $('f_swap').onclick = () => { commit(); [m.from, m.to] = [m.to, m.from]; render(); renderPanel(); save(); };
            $('f_up').onclick = () => moveItem(state.messages, m.id, -1);
            $('f_down').onclick = () => moveItem(state.messages, m.id, 1);
            $('f_del').onclick = deleteSelection;
            $('f_addfrag').onclick = addFragment;
        }
    }

    /* ============================================================
     * Tool palette
     * ============================================================ */
    const toolGrid = $('toolGrid');
    function toolLabel(t) {
        if (t === 'select') return '選択';
        if (t.startsWith('add:')) return NODE_LABEL[t.slice(4)] || t.slice(4);
        return REL[t.slice(4)] ? REL[t.slice(4)].label : t;
    }
    function buildPalette() {
        const def = DIAGRAMS[diagramType()];
        const tools = ['select', ...def.nodes.map(n => 'add:' + n.kind), ...def.rels.map(r => 'rel:' + r)];
        toolGrid.replaceChildren(...tools.map(t => {
            const b = document.createElement('button');
            b.className = 'tool'; b.dataset.tool = t;
            b.innerHTML = `<span class="gly">${toolGlyph(t)}</span><span>${toolLabel(t)}</span>`;
            b.onclick = () => setMode(t);
            return b;
        }));
        setMode('select');
    }
    function setMode(m) {
        mode = m;
        toolGrid.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === m));
        canvas.classList.remove('mode-select', 'mode-class', 'mode-rel');
        canvas.classList.add(m === 'select' ? 'mode-select' : m.startsWith('add:') ? 'mode-class' : 'mode-rel');
        $('modeLabel').textContent = toolLabel(m);
        setStatus(m === 'select' ? '' : 'ok', m === 'select' ? '選択モード' :
            m.startsWith('add:') ? `クリックで${toolLabel(m)}を配置` : toolLabel(m) + ': ノード間をドラッグ');
    }

    function switchType(t) {
        if (!DIAGRAMS[t] || t === project.type) { $('diagramType').value = project.type; return; }
        project.diagrams[project.type] = state;
        project.type = t;
        state = project.diagrams[t] || (project.diagrams[t] = emptyDiagramFor(t));
        selection = null; selNodes = new Set();
        history = []; future = [];
        buildPalette();
        buildTemplateOptions();
        $('textBtn').disabled = !canText(t);
        if (!canText(t) && drawerOpen) toggleDrawer(false);
        render(); renderPanel(); fitView(); save();
        $('diagramType').value = t;
    }
    $('diagramType').onchange = () => switchType($('diagramType').value);

    /* ============================================================
     * テキスト⇄図 双方向同期（PlantUML風DSL）※クラス図のみ
     * ============================================================ */
    const dsl = $('dsl'), textDrawer = $('textDrawer');
    let drawerOpen = false;

    function ident(name) { return /^[A-Za-z_][\w]*$/.test(name) ? name : '"' + String(name).replace(/"/g, '') + '"'; }

    function edgeToDSL(e, nameOf) {
        const F = nameOf(e.from), T = nameOf(e.to);
        let left, right, op, lm, rm;
        switch (e.type) {
            case 'inheritance': left = T; right = F; op = '<|--'; lm = e.toMult; rm = e.fromMult; break;
            case 'realization': left = T; right = F; op = '<|..'; lm = e.toMult; rm = e.fromMult; break;
            case 'directed':    left = F; right = T; op = '-->'; lm = e.fromMult; rm = e.toMult; break;
            case 'dependency':  left = F; right = T; op = '..>'; lm = e.fromMult; rm = e.toMult; break;
            case 'aggregation': left = F; right = T; op = 'o--'; lm = e.fromMult; rm = e.toMult; break;
            case 'composition': left = F; right = T; op = '*--'; lm = e.fromMult; rm = e.toMult; break;
            default:            left = F; right = T; op = '--';  lm = e.fromMult; rm = e.toMult;
        }
        let s = ident(left);
        if (lm) s += ` "${lm}"`;
        s += ' ' + op + ' ';
        if (rm) s += `"${rm}" `;
        s += ident(right);
        if (e.label) s += ' : ' + e.label;
        return s;
    }

    function toDSL() {
        const nameOf = id => { const n = nodeById(id); return n ? n.name : id; };
        const L = ['@startuml'];
        for (const n of state.nodes) {
            if (n.kind === 'note') continue;            // ノートはDSL対象外
            let kw = 'class', stereo = n.stereotype || '';
            if (stereo === 'interface') { kw = 'interface'; stereo = ''; }
            else if (stereo === 'abstract') { kw = 'abstract class'; stereo = ''; }
            const head = kw + ' ' + ident(n.name) + (stereo ? ` <<${stereo}>>` : '');
            const body = [...(n.attributes || []), ...(n.methods || [])];
            if (body.length) { L.push(head + ' {'); body.forEach(m => L.push('  ' + m)); L.push('}'); }
            else L.push(head);
        }
        if (state.nodes.length && state.edges.length) L.push('');
        for (const e of state.edges) L.push(edgeToDSL(e, nameOf));
        L.push('@enduml');
        return L.join('\n');
    }

    const REL_OPS = {
        '<|--': ['inheritance', 'RL'], '--|>': ['inheritance', 'LR'],
        '<|..': ['realization', 'RL'], '..|>': ['realization', 'LR'],
        '..>': ['dependency', 'LR'], '<..': ['dependency', 'RL'],
        '-->': ['directed', 'LR'], '<--': ['directed', 'RL'],
        '*--': ['composition', 'LR'], '--*': ['composition', 'RL'],
        'o--': ['aggregation', 'LR'], '--o': ['aggregation', 'RL'],
        '--': ['association', 'LR'], '..': ['association', 'LR']
    };
    const REL_RE = /^("([^"]+)"|[\w]+)\s*(?:"([^"]*)")?\s*(<\|--|--\|>|<\|\.\.|\.\.\|>|\.\.>|<\.\.|-->|<--|\*--|--\*|o--|--o|\.\.|--)\s*(?:"([^"]*)")?\s*("([^"]+)"|[\w]+)\s*(?::\s*(.+))?$/;
    const CLASS_RE = /^(abstract\s+class|abstract|class|interface|enum)\s+("([^"]+)"|[\w]+)\s*(?:<<\s*([^>]+?)\s*>>)?\s*(\{)?\s*$/i;

    function parseDSL(src) {
        const nodes = [], edges = [], map = new Map();
        const ensure = name => { if (!map.has(name)) { const o = { name, stereotype: '', attributes: [], methods: [] }; map.set(name, o); nodes.push(o); } return map.get(name); };
        let cur = null;
        for (const raw of src.split('\n')) {
            const line = raw.trim();
            if (!line || /^@(start|end)uml/i.test(line) || line.startsWith("'")) continue;
            if (cur) {
                if (line === '}') { cur = null; continue; }
                if (/[()]/.test(line)) cur.methods.push(line); else cur.attributes.push(line);
                continue;
            }
            const cm = line.match(CLASS_RE);
            if (cm) {
                const name = cm[3] || cm[2];
                const node = ensure(name);
                const kw = cm[1].toLowerCase();
                if (/interface/.test(kw)) node.stereotype = 'interface';
                else if (/abstract/.test(kw)) node.stereotype = 'abstract';
                if (cm[4]) node.stereotype = cm[4].trim();
                if (cm[5] === '{') cur = node;
                continue;
            }
            const rm = line.match(REL_RE);
            if (rm) {
                const left = rm[2] || rm[1], leftMult = rm[3] || '', op = rm[4], rightMult = rm[5] || '', right = rm[7] || rm[6], label = (rm[8] || '').trim();
                const def = REL_OPS[op]; if (!def) continue;
                const [type, dir] = def;
                ensure(left); ensure(right);
                let from, to, fromMult, toMult;
                if (type === 'inheritance' || type === 'realization') {
                    if (dir === 'RL') { to = left; from = right; toMult = leftMult; fromMult = rightMult; }
                    else { from = left; to = right; fromMult = leftMult; toMult = rightMult; }
                } else {
                    if (dir === 'LR') { from = left; to = right; fromMult = leftMult; toMult = rightMult; }
                    else { from = right; to = left; fromMult = rightMult; toMult = leftMult; }
                }
                edges.push({ fromName: from, toName: to, type, fromMult, toMult, label });
            }
            // 認識できない行は無視
        }
        return { nodes, edges };
    }

    function nextFreePos(taken) {
        // 既存ノードと重ならない位置を簡易探索
        for (let row = 0; row < 40; row++) for (let col = 0; col < 6; col++) {
            const x = 60 + col * 220, y = 60 + row * 150;
            if (!taken.some(n => Math.abs(n.x - x) < 180 && Math.abs(n.y - y) < 120)) { taken.push({ x, y, w: 160, h: 100 }); return { x, y }; }
        }
        return { x: 60, y: 60 };
    }

    function applyParsed(parsed) {
        const idByName = new Map();
        const placed = [];
        const newNodes = parsed.nodes.map(pn => {
            const ex = state.nodes.find(n => n.name === pn.name);
            const id = ex ? ex.id : uid('n');
            idByName.set(pn.name, id);
            let pos;
            if (ex) pos = { x: ex.x, y: ex.y }; else pos = nextFreePos(placed.concat(state.nodes));
            placed.push({ x: pos.x, y: pos.y, w: 160, h: 100 });
            return { id, x: pos.x, y: pos.y, name: pn.name, stereotype: pn.stereotype, attributes: pn.attributes, methods: pn.methods };
        });
        const newEdges = parsed.edges.filter(e => idByName.has(e.fromName) && idByName.has(e.toName))
            .map(e => ({ id: uid('e'), from: idByName.get(e.fromName), to: idByName.get(e.toName), type: e.type, fromMult: e.fromMult || '', toMult: e.toMult || '', label: e.label || '' }));
        // ノート（DSL対象外）は維持
        newNodes.push(...state.nodes.filter(n => n.kind === 'note'));
        state.nodes = newNodes; state.edges = newEdges;
        if (selection && selection.kind === 'node' && !state.nodes.some(n => n.id === selection.id)) selection = null;
        selNodes = new Set([...selNodes].filter(id => state.nodes.some(n => n.id === id)));
        render(); renderPanel(); save();
    }

    /* ---- シーケンス図 DSL（PlantUML風） ---- */
    function seqIdent(name) { return /^[A-Za-z_][\w]*$/.test(name) ? name : '"' + String(name).replace(/"/g, '') + '"'; }
    function seqArrowOf(t) { return t === 'async' ? '->>' : t === 'reply' ? '-->' : '->'; }

    function toSeqDSL() {
        const ps = state.participants || [], msgs = state.messages || [], frags = state.fragments || [];
        const pname = id => { const p = ps.find(o => o.id === id); return p ? p.name : id; };
        const idx = id => msgs.findIndex(m => m.id === id);
        const L = ['@startuml'];
        ps.forEach((p, i) => L.push(`${p.kind === 'actor' ? 'actor' : 'participant'} ${seqIdent(p.name)} as p${i + 1}`));
        if (ps.length && msgs.length) L.push('');
        const opens = {}, closes = {}, elses = {};
        for (const f of frags) {
            let a = idx(f.from), b = idx(f.to); if (a < 0 || b < 0) continue; if (a > b) { const t = a; a = b; b = t; }
            (opens[a] || (opens[a] = [])).push({ f, span: b - a }); (closes[b] || (closes[b] = [])).push({ f, span: b - a });
            if (f.type === 'alt' && f.elseAfter) { const ei = idx(f.elseAfter); if (ei >= 0) (elses[ei] || (elses[ei] = [])).push(f); }
        }
        let depth = 0; const ind = () => '  '.repeat(depth);
        msgs.forEach((m, i) => {
            (opens[i] || []).sort((x, y) => y.span - x.span).forEach(({ f }) => { L.push(ind() + f.type + (f.label ? ' ' + f.label : '')); depth++; });
            L.push(`${ind()}${seqIdent(pname(m.from))} ${seqArrowOf(m.type)} ${seqIdent(pname(m.to))}${m.text ? ' : ' + m.text : ''}`);
            (elses[i] || []).forEach(f => { L.push('  '.repeat(Math.max(0, depth - 1)) + 'else' + (f.elseLabel ? ' ' + f.elseLabel : '')); });
            (closes[i] || []).sort((x, y) => x.span - y.span).forEach(() => { depth--; L.push(ind() + 'end'); });
        });
        L.push('@enduml');
        return L.join('\n');
    }

    const SEQ_MSG_RE = /^(?:"([^"]+)"|([^\s:]+))\s*(-->>|->>|-->|->|<<--|<--|<<-|<-)\s*(?:"([^"]+)"|([^\s:]+))\s*(?::\s*(.*))?$/;
    const SEQ_DECL_RE = /^(participant|actor|boundary|control|entity|database|collections)\s+(?:"([^"]+)"|(\w+))(?:\s+as\s+(\w+))?\s*$/i;
    const SEQ_FRAG_RE = /^(alt|opt|loop|par|break|critical|group)\b\s*(.*)$/i;

    function parseSeqDSL(src) {
        const ps = [], pmap = new Map(), msgs = [], frags = [], stack = [];
        let lastMsgId = null;
        const ensure = key => {
            if (pmap.has(key)) return pmap.get(key);
            const p = { id: uid('p'), kind: 'participant', name: key }; ps.push(p); pmap.set(key, p); return p;
        };
        for (const raw of src.split('\n')) {
            const line = raw.trim();
            if (!line || /^@(start|end)uml/i.test(line) || line.startsWith("'")) continue;
            const dm = line.match(SEQ_DECL_RE);
            if (dm) {
                const name = dm[2] || dm[3], alias = dm[4];
                const p = { id: uid('p'), kind: /actor/i.test(dm[1]) ? 'actor' : 'participant', name };
                ps.push(p); pmap.set(name, p); if (alias) pmap.set(alias, p);
                continue;
            }
            const fo = line.match(SEQ_FRAG_RE);
            if (fo) { const ty = fo[1].toLowerCase(); stack.push({ type: ty === 'group' ? 'opt' : ty, label: fo[2].trim(), from: null, elseAfter: '', elseLabel: '' }); continue; }
            const em = line.match(/^else\b\s*(.*)$/i);
            if (em) { const top = stack[stack.length - 1]; if (top) { top.elseAfter = lastMsgId; top.elseLabel = em[1].trim(); } continue; }
            if (/^end\b/i.test(line)) { const top = stack.pop(); if (top && top.from) frags.push({ id: uid('f'), type: top.type, label: top.label, from: top.from, to: lastMsgId, elseAfter: top.elseAfter, elseLabel: top.elseLabel }); continue; }
            if (/^note\b/i.test(line)) continue;            // ノートは保持・対象外
            const mm = line.match(SEQ_MSG_RE);
            if (mm) {
                const op = mm[3], reverse = op[0] === '<';
                const a = reverse ? (mm[4] || mm[5]) : (mm[1] || mm[2]);
                const b = reverse ? (mm[1] || mm[2]) : (mm[4] || mm[5]);
                const type = /--/.test(op) ? 'reply' : />>|<</.test(op) ? 'async' : 'sync';
                const pa = ensure(a), pb = ensure(b);
                const m = { id: uid('m'), from: pa.id, to: pb.id, type, text: (mm[6] || '').trim() };
                msgs.push(m); lastMsgId = m.id;
                for (const fr of stack) if (!fr.from) fr.from = m.id;
            }
        }
        return { participants: ps, messages: msgs, fragments: frags };
    }

    function applySeqParsed(parsed) {
        state.participants = parsed.participants;
        state.messages = parsed.messages;
        state.fragments = parsed.fragments;
        // state.notes は維持
        selection = null;
        render(); renderPanel(); save();
    }

    /* ---- 状態遷移図 DSL（PlantUML風） ---- */
    function toStateDSL() {
        const nodes = state.nodes || [], edges = state.edges || [];
        const byId = id => nodes.find(n => n.id === id);
        const aliasMap = new Map(); let ac = 0;
        const tok = n => {
            if (n.kind === 'initial' || n.kind === 'final') return '[*]';
            const name = n.name || 'State';
            if (/\s/.test(name) || name === '') { if (!aliasMap.has(n.id)) aliasMap.set(n.id, { alias: 'S' + (++ac), name }); return aliasMap.get(n.id).alias; }
            return name;
        };
        const elines = edges.map(e => { const a = byId(e.from), b = byId(e.to); return (a && b) ? { ta: tok(a), tb: tok(b), label: e.label } : null; }).filter(Boolean);
        const used = new Set(); edges.forEach(e => { used.add(e.from); used.add(e.to); });
        const isolated = nodes.filter(n => n.kind === 'state' && !used.has(n.id)).map(n => ({ tok: tok(n) }));
        const L = ['@startuml'];
        for (const { alias, name } of aliasMap.values()) L.push(`state "${name}" as ${alias}`);
        if (aliasMap.size) L.push('');
        elines.forEach(e => L.push(`${e.ta} --> ${e.tb}${e.label ? ' : ' + e.label : ''}`));
        isolated.forEach(s => L.push(`state ${s.tok}`));
        L.push('@enduml');
        return L.join('\n');
    }

    function parseStateDSL(src) {
        const nodes = [], edges = [], byName = new Map(), byAlias = new Map();
        let initialId = null, finalId = null;
        const ensureState = token => {
            if (byAlias.has(token)) return byAlias.get(token);
            if (byName.has(token)) return byName.get(token);
            const o = { id: uid('n'), kind: 'state', name: token, attributes: [], methods: [] };
            nodes.push(o); byName.set(token, o); return o;
        };
        const initNode = () => { if (!initialId) { const o = { id: uid('n'), kind: 'initial', name: '' }; nodes.push(o); initialId = o.id; } return initialId; };
        const finalNode = () => { if (!finalId) { const o = { id: uid('n'), kind: 'final', name: '' }; nodes.push(o); finalId = o.id; } return finalId; };
        for (const raw of src.split('\n')) {
            const line = raw.trim();
            if (!line || /^@(start|end)uml/i.test(line) || line.startsWith("'")) continue;
            let dm = line.match(/^state\s+"([^"]+)"\s+as\s+(\w+)\s*$/i);
            if (dm) { const o = { id: uid('n'), kind: 'state', name: dm[1], attributes: [], methods: [] }; nodes.push(o); byAlias.set(dm[2], o); byName.set(dm[1], o); continue; }
            let ds = line.match(/^state\s+(?:"([^"]+)"|(\S+))\s*$/i);
            if (ds) { const name = ds[1] || ds[2]; if (!byName.has(name) && !byAlias.has(name)) { const o = { id: uid('n'), kind: 'state', name, attributes: [], methods: [] }; nodes.push(o); byName.set(name, o); } continue; }
            if (/^note\b/i.test(line)) continue;
            let tm = line.match(/^(\[\*\]|"[^"]+"|[^\s:]+)\s*-+>\s*(\[\*\]|"[^"]+"|[^\s:]+)\s*(?::\s*(.*))?$/);
            if (tm) {
                const l = tm[1].replace(/^"|"$/g, ''), r = tm[2].replace(/^"|"$/g, ''), label = (tm[3] || '').trim();
                const from = l === '[*]' ? initNode() : ensureState(l).id;
                const to = r === '[*]' ? finalNode() : ensureState(r).id;
                edges.push({ id: uid('e'), from, to, type: 'transition', fromMult: '', toMult: '', label });
            }
        }
        return { nodes, edges };
    }

    function applyStateParsed(parsed) {
        const existing = state.nodes || [], placed = [];
        const findPos = pn => {
            let ex;
            if (pn.kind === 'initial') ex = existing.find(n => n.kind === 'initial');
            else if (pn.kind === 'final') ex = existing.find(n => n.kind === 'final');
            else ex = existing.find(n => n.kind !== 'note' && n.name === pn.name);
            const pos = ex ? { x: ex.x, y: ex.y } : nextFreePos(placed.concat(existing));
            placed.push({ x: pos.x, y: pos.y, w: 120, h: 60 });
            return pos;
        };
        const newNodes = parsed.nodes.map(pn => Object.assign({}, pn, findPos(pn)));
        newNodes.push(...existing.filter(n => n.kind === 'note'));
        state.nodes = newNodes; state.edges = parsed.edges;
        selection = null; selNodes = new Set();
        render(); renderPanel(); save();
    }

    function buildSVG() {
        if (isSeq()) renderSequence(); else state.nodes.forEach(layoutNode);
        const b = bbox(), pad = 24;
        const W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
        const inner = edgesLayer.outerHTML + nodesLayer.outerHTML;
        return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${b.x - pad} ${b.y - pad} ${W} ${H}">
<style>${exportStyle()}</style>
<rect x="${b.x - pad}" y="${b.y - pad}" width="${W}" height="${H}" fill="${cssVar('--canvas-bg')}"/>
${inner}
</svg>`;
    }
    function download(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function tsName(ext) { const d = new Date(), p = n => String(n).padStart(2, '0');
        return `uml-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`; }

    $('svgBtn').onclick = () => {

    };
    function svgToPng(scaleFactor) {
        return new Promise((resolve, reject) => {
            const b = bbox(), pad = 24, W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
            const url = URL.createObjectURL(new Blob([buildSVG()], { type: 'image/svg+xml;charset=utf-8' }));
            const img = new Image();
            img.onload = () => {
                try {
                    const c = document.createElement('canvas');
                    c.width = Math.max(1, Math.round(W * scaleFactor)); c.height = Math.max(1, Math.round(H * scaleFactor));
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = cssVar('--canvas-bg'); ctx.fillRect(0, 0, c.width, c.height);
                    ctx.drawImage(img, 0, 0, c.width, c.height);
                    c.toBlob(bl => { URL.revokeObjectURL(url); bl ? resolve(bl) : reject(new Error('PNG変換失敗')); }, 'image/png');
                } catch (err) { URL.revokeObjectURL(url); reject(err); }
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像化に失敗しました')); };
            img.src = url;
        });
    }

    function loadState(obj) {
        if (!obj || !(Array.isArray(obj.nodes) || Array.isArray(obj.participants))) throw new Error('bad');
        const t = (obj.type && DIAGRAMS[obj.type]) ? obj.type : (Array.isArray(obj.participants) ? 'sequence' : project.type);
        if (t !== project.type) {
            project.diagrams[project.type] = state;

            $('textBtn').disabled = !canText(t);

        const nd = (t === 'sequence')
            ? { participants: obj.participants || [], messages: Array.isArray(obj.messages) ? obj.messages : [], fragments: Array.isArray(obj.fragments) ? obj.fragments : [], notes: Array.isArray(obj.notes) ? obj.notes : [] }
            : { nodes: obj.nodes || [], edges: Array.isArray(obj.edges) ? obj.edges : [] };
        project.diagrams[t] = nd; state = nd;
        const items = (t === 'sequence') ? nd.participants.concat(nd.messages, nd.fragments, nd.notes) : nd.nodes.concat(nd.edges);
        let mx = 0; items.forEach(o => { const m = /(\d+)$/.exec(o.id || ''); if (m) mx = Math.max(mx, +m[1]); });

        '    コンポーネント図/シーケンス図を切替（各図は個別に保存）',
        '',
        '【操作（クラス/状態/ユースケース/コンポーネント）】',
        '  ・左のツールでノードを選び、キャンバスをクリックで配置',
        '  ・空白をダブルクリックでもノードを追加',
        '  ・関連線ツールを選び、ノードからノードへドラッグして接続',
        '  ・選択ツールでノードをドラッグして移動',
        '  ・右パネルで名前・属性・操作・多重度・ラベルを編集',
        '  ・「ノート」で付箋（注釈）を全図種に配置できます',
        '',
        '【シーケンス図】',
        '  ・ライフライン/アクターでクリックして追加',
        '  ・同期/非同期/応答を選びライフライン間をドラッグでメッセージ',
        '  ・同じライフラインへドラッグで自己メッセージ',
        '  ・メッセージは時間順、選択して▲▼で並べ替え',
        '  ・同期呼び出し→応答 で実行仕様バーを自動表示',
        '  ・プロパティの「フラグメント追加」でalt/loop/optの枠を作成',
        '',
        '【複数選択・整列】',
        '  ・Shift+クリック で複数選択 / Shift+ドラッグ で範囲選択',
        '  ・Ctrl/Cmd+A で全選択',
        '  ・2件以上選択でプロパティに整列ボタン（左/中央/右/上下/等間隔）',
        '  ・🧲 グリッド吸着、▦ 自動整列（継承の階層レイアウト）',
        '',
        '【テキスト双方向同期（クラス図・シーケンス図・状態遷移図）】',
        '  ・</>テキスト でPlantUML風コードを表示',
        '  ・図の編集→テキストに即反映、テキスト編集→図に反映',
        '  ・シーケンスは A -> B : msg / alt…else…end / loop / opt 等',
        '  ・状態遷移は [*] --> 待機 / A --> B : event',
        '',
        '【ショートカット】',
        '  Delete / Backspace … 選択を削除',
        '  Ctrl/Cmd + Z … 元に戻す / Shift+Z でやり直し',
        '  Ctrl/Cmd + D … 複製 / C コピー / V 貼り付け',
        '  Shift + F … 全体表示 / C ノード追加 / V 選択 / ESC 選択へ',
        '  ホイール … 拡大縮小 / 空白ドラッグ … 画面移動',
        '',
        '【特長】',
        '  ・完全オフライン動作（サーバー・外部ライブラリ不要）',
        '  ・SVG / PNG（最大4x）書き出し・画像コピー',
        '  ・JSON 保存/読込・共有リンク・自動保存'
    ].join('\n'));

    /* ---- snap / layout ---- */
    $('snapBtn').onclick = () => { snapOn = !snapOn; $('snapBtn').classList.toggle('toggle-on', snapOn); toast('グリッド吸着: ' + (snapOn ? 'ON' : 'OFF')); };
    $('layoutBtn').onclick = autoLayout;

    /* ---- keyboard ---- */
    document.addEventListener('keydown', e => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
        if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
        if (typing) return;
        if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
        if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelection(); return; }
        if (mod && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }
        if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); if (isSeq()) return; selNodes = new Set(state.nodes.map(n => n.id)); selection = state.nodes.length ? { kind: 'node', id: state.nodes[state.nodes.length - 1].id } : null; refreshSelectionStyles(); renderPanel(); return; }
        if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); }
        else if (e.key === 'Escape') { setMode('select'); select(null); }
        else if (e.key === 'c' || e.key === 'C') setMode('add:' + DIAGRAMS[diagramType()].nodes[0].kind);
        else if (e.key === 'v' || e.key === 'V') setMode('select');
        else if ((e.key === 'f' || e.key === 'F') && e.shiftKey) { e.preventDefault(); fitView(); }
    });

    /* ---- divider ---- */
    (() => {
        const divider = $('divider'), side = document.querySelector('.side'), main = document.querySelector('.main');
        let active = false;
        divider.addEventListener('pointerdown', e => { active = true; divider.classList.add('active'); divider.setPointerCapture(e.pointerId); document.body.style.userSelect = 'none'; });
        divider.addEventListener('pointermove', e => {
            if (!active) return;
            const rect = main.getBoundingClientRect();
            side.style.flex = `0 0 ${Math.max(220, Math.min(460, e.clientX - rect.left))}px`;
        });
        divider.addEventListener('pointerup', e => { active = false; divider.classList.remove('active'); document.body.style.userSelect = ''; try { divider.releasePointerCapture(e.pointerId); } catch (_) {} });
    })();
    window.addEventListener('resize', () => applyView());

    /* ============================================================
     * Init
     * ============================================================ */
    function recomputeSeq() {
        let mx = 0;
        for (const t in project.diagrams) {
            const d = project.diagrams[t];
            const items = (t === 'sequence') ? (d.participants || []).concat(d.messages || [], d.fragments || [], d.notes || []) : (d.nodes || []).concat(d.edges || []);
            items.forEach(o => { const m = /(\d+)$/.exec(o.id || ''); if (m) mx = Math.max(mx, +m[1]); });
        }
        seq = mx + 1;
    }

    function validDiagram(t, d) {
        if (!d) return false;
        return (t === 'sequence') ? Array.isArray(d.participants) : Array.isArray(d.nodes);
    }

    (function init() {
        let shared = null, stored = null;
        const m = location.hash.match(/#d=(.+)/);
        if (m) { try { shared = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (_) {} }
        try { const s = localStorage.getItem(LS_KEY); if (s) stored = JSON.parse(s); } catch (_) {}

        if (stored && stored.diagrams && stored.type) {                 // 新形式（プロジェクト）
            project = { type: DIAGRAMS[stored.type] ? stored.type : 'class', diagrams: {} };
            for (const t in DIAGRAMS) project.diagrams[t] = validDiagram(t, stored.diagrams[t]) ? stored.diagrams[t] : emptyDiagramFor(t);
        } else if (stored && Array.isArray(stored.nodes)) {             // 旧形式（単一クラス図）→移行
            for (const t in DIAGRAMS) project.diagrams[t] = emptyDiagramFor(t);
            project.diagrams.class = { nodes: stored.nodes, edges: Array.isArray(stored.edges) ? stored.edges : [] };
        } else {
            project.diagrams.class = TEMPLATES.c_inherit.make();
        }
        state = project.diagrams[project.type];
        recomputeSeq();

        $('diagramType').value = project.type;
        $('textBtn').disabled = !canText(project.type);
        buildPalette();
        buildTemplateOptions();
        render(); renderPanel(); fitView();
        setStatus('', '準備完了');

        // 共有リンクがあれば取り込み（該当図種へ）
        if (shared && (Array.isArray(shared.nodes) ? shared.nodes.length : Array.isArray(shared.participants) && shared.participants.length)) loadState(shared);
    })();
    </script>
</body>
</html>
