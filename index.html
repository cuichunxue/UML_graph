<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="完全オフラインで動くインタラクティブUMLクラス図エディタ。クラスをドラッグで配置・接続し、SVG/PNGで書き出せます。サーバー不要・依存ライブラリ不要。">
    <meta name="color-scheme" content="light dark">
    <title>UML図エディタ</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --panel: #ffffff;
            --panel-2: #fafbfc;
            --border: #e2e4e8;
            --border-strong: #c8ccd2;
            --text: #1f2328;
            --text-soft: #57606a;
            --text-faint: #8b949e;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff4ff;
            --error-fg: #b42318;
            --success-fg: #067647;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            /* diagram */
            --node-fill: #ffffff;
            --node-stroke: #334155;
            --node-head: #f1f5f9;
            --line: #475569;
            --muted: #64748b;
            --sel: #2563eb;
            --canvas-bg: #f8fafc;
            --sticky: #fff8c5;
        }
        [data-theme="dark"] {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-2: #131820;
            --border: #2a313c;
            --border-strong: #3d444d;
            --text: #e6edf3;
            --text-soft: #adbac7;
            --text-faint: #768390;
            --accent: #2f81f7;
            --accent-hover: #4493f8;
            --accent-soft: #1c2a3f;
            --error-fg: #ff7b72;
            --success-fg: #57ab5a;
            --shadow: 0 1px 3px rgba(0,0,0,.4);
            --node-fill: #1c2431;
            --node-stroke: #8696a7;
            --node-head: #232c3a;
            --line: #9aa7b5;
            --muted: #8b98a6;
            --sel: #4493f8;
            --canvas-bg: #0e131a;
            --sticky: #3a371d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ---------- Header ---------- */
        .header {
            background: var(--panel); border-bottom: 1px solid var(--border);
            padding: 0 16px; height: 52px; display: flex; align-items: center;
            justify-content: space-between; flex: none; z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand .logo {
            width: 28px; height: 28px; border-radius: 6px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 12px; font-weight: 700; letter-spacing: -.02em;
        }
        .brand h1 { font-size: 1.02rem; font-weight: 650; letter-spacing: -.01em; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px; font-size: .74rem;
            color: var(--text-faint); padding: 4px 10px; border-radius: 999px;
            border: 1px solid var(--border); white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis;
        }
        .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
        .status-pill.ok .dot { background: var(--success-fg); }
        .saved-badge { font-size: .72rem; color: var(--text-faint); opacity: 0; transition: opacity .25s; }
        .saved-badge.show { opacity: 1; }

        /* ---------- Layout ---------- */
        .main { flex: 1; display: flex; min-height: 0; }
        .side, .canvas-section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .side { flex: 0 0 290px; background: var(--panel); border-right: 1px solid var(--border); }
        .canvas-section { flex: 1; background: var(--panel-2); }

        .divider { flex: none; width: 6px; cursor: col-resize; background: transparent; position: relative; z-index: 5; }
        .divider::after { content: ''; position: absolute; inset: 0 2px; border-radius: 3px; background: var(--border); transition: background .15s; }
        .divider:hover::after, .divider.active::after { background: var(--accent); }

        /* ---------- Toolbars ---------- */
        .toolbar {
            padding: 8px 12px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; flex-wrap: wrap; background: var(--panel); flex: none;
        }
        .canvas-section .toolbar { background: var(--panel-2); }
        .toolbar-label { font-size: .82rem; font-weight: 600; color: var(--text-soft); white-space: nowrap; }
        .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px;
            border: 1px solid var(--border-strong); border-radius: 6px; background: var(--panel);
            font-size: .8rem; font-weight: 500; color: var(--text); cursor: pointer; white-space: nowrap;
            transition: background .12s, border-color .12s, color .12s, opacity .12s;
        }
        .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .btn:active { transform: translateY(.5px); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn:disabled:hover { background: var(--panel); border-color: var(--border-strong); color: var(--text); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
        .btn .ico { font-size: .95em; line-height: 1; }
        .btn.icon-only { padding: 6px 8px; }

        /* ---------- Palette ---------- */
        .side-scroll { flex: 1; overflow-y: auto; min-height: 0; }
        .palette { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .palette h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 8px; font-weight: 700; }
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .tool {
            display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--border-strong);
            border-radius: 6px; background: var(--panel); font-size: .78rem; color: var(--text); cursor: pointer;
            transition: all .12s; text-align: left; width: 100%;
        }
        .tool:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .tool.active { border-color: var(--accent); background: var(--accent); color: #fff; }
        .tool .gly { width: 26px; height: 16px; flex: none; }
        .tool .gly svg { width: 100%; height: 100%; display: block; }
        .tool.active .gly svg * { stroke: #fff !important; fill: #fff !important; }
        .tool.active .gly svg .hollow { fill: var(--accent) !important; }

        /* ---------- Properties ---------- */
        .props { padding: 12px; }
        .props h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 10px; font-weight: 700; }
        .field { margin-bottom: 11px; }
        .field label { display: block; font-size: .72rem; color: var(--text-soft); margin-bottom: 4px; font-weight: 600; }
        .field input, .field select, .field textarea {
            width: 100%; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 6px;
            background: var(--panel-2); color: var(--text); font-size: .82rem; font-family: inherit;
        }
        .field textarea { resize: vertical; min-height: 64px; line-height: 1.5;
            font-family: 'SF Mono','JetBrains Mono','Consolas',monospace; font-size: .78rem; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
        .field .hint { font-size: .68rem; color: var(--text-faint); margin-top: 3px; }
        .empty-hint { font-size: .8rem; color: var(--text-faint); line-height: 1.7; }
        .empty-hint kbd {
            font-family: monospace; font-size: .72rem; background: var(--panel-2);
            border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px;
        }
        .danger { color: var(--error-fg); border-color: var(--error-fg) !important; }
        .danger:hover { background: var(--error-fg) !important; color: #fff !important; border-color: var(--error-fg) !important; }

        .side-status {
            flex: none; height: 30px; border-top: 1px solid var(--border); display: flex; align-items: center;
            gap: 12px; padding: 0 14px; font-size: .72rem; color: var(--text-faint); background: var(--panel-2);
        }
        .side-status .sep { flex: 1; }

        /* zoom group */
        .zoom-group { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
        .zoom-group .zbtn {
            width: 30px; height: 30px; border: none; background: var(--panel); color: var(--text-soft);
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border);
        }
        .zoom-group .zbtn:last-child { border-right: none; }
        .zoom-group .zbtn:hover { background: var(--accent-soft); color: var(--accent); }
        .zoom-level { min-width: 52px; text-align: center; font-size: .76rem; color: var(--text-soft);
            font-variant-numeric: tabular-nums; user-select: none; border-right: 1px solid var(--border); line-height: 30px; }

        /* ---------- Canvas ---------- */
        .canvas-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        .canvas-area { flex: 1; position: relative; overflow: hidden; min-height: 0;
            background: var(--canvas-bg) radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0 / 22px 22px; }
        .btn.toggle-on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.toggle-on:hover { background: var(--accent-hover); color: #fff; }

        /* text drawer */
        .text-drawer { flex: none; height: 40%; min-height: 120px; display: flex; flex-direction: column;
            border-top: 1px solid var(--border); background: var(--panel); }
        .text-drawer[hidden] { display: none; }
        .drawer-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--border);
            font-size: .76rem; color: var(--text-soft); background: var(--panel-2); }
        .drawer-head em { font-style: normal; font-size: .66rem; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
        .drawer-head .dsl-status { margin-left: auto; font-size: .72rem; padding: 2px 8px; border-radius: 4px; }
        .dsl-status.ok { color: var(--success-fg); }
        .dsl-status.err { color: var(--error-fg); }
        #dsl { flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 10px 12px;
            font-family: 'SF Mono','JetBrains Mono','Consolas',monospace; font-size: 12.5px; line-height: 1.55;
            tab-size: 2; background: var(--panel); color: var(--text); }
        .marquee { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
        .node.multi .node-rect { stroke: var(--sel); stroke-dasharray: 5 3; }
        #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
        #canvas.mode-select .node:hover .node-rect { stroke: var(--accent); }
        #canvas.mode-rel { cursor: crosshair; }
        #canvas.mode-class { cursor: copy; }
        .node { cursor: grab; }
        .node-rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
        .node-head { fill: var(--node-head); }
        .compartment-sep { stroke: var(--node-stroke); stroke-width: 1; }
        .node-name { fill: var(--text); font: 600 14px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .node-stereo { fill: var(--muted); font: italic 12px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .node-member { fill: var(--text); font: 13px 'SF Mono','Consolas',monospace; }
        .node.selected .node-rect { stroke: var(--sel); stroke-width: 2.2; }
        .edge-line { stroke: var(--line); fill: none; stroke-width: 1.4; }
        .edge-hit { stroke: transparent; fill: none; stroke-width: 12; cursor: pointer; }
        .marker-hollow { fill: var(--node-fill); stroke: var(--line); stroke-width: 1.4; }
        .marker-filled { fill: var(--line); stroke: var(--line); stroke-width: 1.4; }
        .marker-open { fill: none; stroke: var(--line); stroke-width: 1.4; }
        .edge-label { fill: var(--text); font: 12px -apple-system,'Segoe UI',sans-serif; }
        .edge-label-bg { fill: var(--canvas-bg); opacity: .85; }
        .edge.selected .edge-line { stroke: var(--sel); stroke-width: 2.4; }
        .edge.selected .marker-hollow, .edge.selected .marker-open { stroke: var(--sel); }
        .edge.selected .marker-filled { fill: var(--sel); stroke: var(--sel); }
        .temp-line { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
        /* 図形（状態/ユースケース/コンポーネント/インタフェース） */
        .shape { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
        .pseudo-fill { fill: var(--node-stroke); stroke: none; }
        .pseudo-ring { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.4; }
        .actor-stroke { fill: none; stroke: var(--node-stroke); stroke-width: 1.6; }
        .actor-head { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.6; }
        .node-title { fill: var(--text); font: 600 13px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .node-sub { fill: var(--muted); font: italic 11px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .boundary-rect { fill: none; stroke: var(--node-stroke); stroke-width: 1.4; stroke-dasharray: 7 5; }
        .boundary-title { fill: var(--muted); font: 600 12px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .comp-icon { fill: var(--node-head); stroke: var(--node-stroke); stroke-width: 1.2; }
        .node.selected .shape, .node.selected .pseudo-ring, .node.selected .actor-stroke, .node.selected .actor-head { stroke: var(--sel); stroke-width: 2.2; }
        .node.selected .pseudo-fill { stroke: var(--sel); stroke-width: 3; }
        .node.multi .shape, .node.multi .pseudo-ring, .node.multi .actor-stroke { stroke: var(--sel); stroke-dasharray: 5 3; }
        /* シーケンス図 */
        .seq-life { stroke: var(--node-stroke); stroke-width: 1.1; stroke-dasharray: 4 4; }
        .seq-line { stroke: var(--line); stroke-width: 1.4; fill: none; }
        .seq-line.dashed { stroke-dasharray: 7 5; }
        .seq-arrow-filled { fill: var(--line); stroke: var(--line); stroke-width: 1.2; }
        .seq-arrow-open { fill: none; stroke: var(--line); stroke-width: 1.4; }
        .seq-label { fill: var(--text); font: 12px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .seq-hit { fill: transparent; stroke: none; cursor: pointer; }
        .seq-part { cursor: grab; }
        .seq-part.selected .shape, .seq-part.selected .actor-stroke, .seq-part.selected .actor-head { stroke: var(--sel); stroke-width: 2.2; }
        .seq-msg.selected .seq-line { stroke: var(--sel); stroke-width: 2.4; }
        .seq-msg.selected .seq-arrow-filled { fill: var(--sel); stroke: var(--sel); }
        .seq-msg.selected .seq-arrow-open { stroke: var(--sel); }
        .seq-activation { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1; }
        .frag-rect { fill: none; stroke: var(--node-stroke); stroke-width: 1.2; }
        .frag-tab { fill: var(--node-head); stroke: var(--node-stroke); stroke-width: 1.2; cursor: pointer; }
        .frag-tab-text { fill: var(--muted); font: 600 11px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .frag-else { stroke: var(--node-stroke); stroke-width: 1; stroke-dasharray: 6 4; }
        .seq-frag.selected .frag-rect, .seq-frag.selected .frag-tab { stroke: var(--sel); stroke-width: 2; }
        /* ノート（付箋） */
        .note-rect { fill: var(--sticky); stroke: var(--node-stroke); stroke-width: 1; }
        .note-fold { fill: none; stroke: var(--node-stroke); stroke-width: 1; }
        .note-text { fill: var(--text); font: 12px -apple-system,'Segoe UI','Noto Sans JP',sans-serif; }
        .node.selected .note-rect, .seq-note.selected .note-rect { stroke: var(--sel); stroke-width: 2.2; }
        .node.multi .note-rect { stroke: var(--sel); stroke-dasharray: 5 3; }
        .seq-note { cursor: grab; }

        .canvas-empty {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: var(--text-faint); font-size: .9rem; text-align: center; padding: 24px; pointer-events: none;
        }

        /* ---------- Toast ---------- */
        .toast-host { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .toast { background: var(--text); color: var(--panel); padding: 9px 16px; border-radius: 8px; font-size: .82rem;
            box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; max-width: 90vw; }
        .toast.show { opacity: .96; transform: translateY(0); }
        .toast.err { background: var(--error-fg); color: #fff; }

        .hidden { display: none !important; }

        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .side { flex: 0 0 auto; height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
            .canvas-section { flex: 1; }
            .divider { display: none; }
            .header-right .status-pill { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <span class="logo" aria-hidden="true">UML</span>
            <h1>UML図エディタ</h1>
        </div>
        <div class="header-right">
            <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">準備中…</span></span>
            <span class="saved-badge" id="savedBadge">保存しました</span>
            <button class="btn icon-only" id="undoBtn" title="元に戻す (Ctrl/Cmd+Z)" aria-label="元に戻す"><span class="ico">↶</span></button>
            <button class="btn icon-only" id="redoBtn" title="やり直し (Ctrl/Cmd+Shift+Z)" aria-label="やり直し"><span class="ico">↷</span></button>
            <button class="btn icon-only" id="themeBtn" title="ライト/ダーク切替" aria-label="テーマ切替"><span class="ico" id="themeIco">🌙</span></button>
            <button class="btn icon-only" id="helpBtn" title="使い方" aria-label="ヘルプ"><span class="ico">?</span></button>
        </div>
    </header>

    <div class="main">
        <section class="side" aria-label="ツール">
            <div class="toolbar">
                <div class="toolbar-group">
                    <select class="btn" id="diagramType" title="図の種類" aria-label="図の種類" style="padding:6px 9px;font-weight:600;">
                        <option value="class">クラス図</option>
                        <option value="state">状態遷移図</option>
                        <option value="usecase">ユースケース図</option>
                        <option value="component">コンポーネント図</option>
                        <option value="sequence">シーケンス図</option>
                    </select>
                    <select class="btn" id="templateSelect" aria-label="テンプレート" style="padding:6px 9px;">
                        <option value="">テンプレート…</option>
                    </select>
                </div>
                <div class="toolbar-group">
                    <button class="btn icon-only" id="importBtn" title="JSONを開く" aria-label="開く"><span class="ico">📂</span></button>
                    <button class="btn icon-only" id="exportJsonBtn" title="JSONを保存" aria-label="保存"><span class="ico">💾</span></button>
                    <button class="btn icon-only danger" id="clearBtn" title="全消去" aria-label="全消去"><span class="ico">🗑</span></button>
                    <input type="file" id="fileInput" accept="application/json,.json" class="hidden">
                </div>
            </div>

            <div class="side-scroll">
                <div class="palette">
                    <h3>ツール</h3>
                    <div class="tool-grid" id="toolGrid"></div>
                </div>
                <div class="props" id="props"></div>
            </div>

            <div class="side-status">
                <span id="countLabel">0 クラス / 0 関連</span>
                <span class="sep"></span>
                <span id="modeLabel">選択</span>
            </div>
        </section>

        <div class="divider" id="divider" role="separator" aria-orientation="vertical" title="ドラッグで幅を調整"></div>

        <section class="canvas-section" aria-label="キャンバス">
            <div class="toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">キャンバス</span>
                    <div class="zoom-group" role="group" aria-label="ズーム">
                        <button class="zbtn" id="zoomOut" title="縮小" aria-label="縮小">−</button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="zbtn" id="zoomIn" title="拡大" aria-label="拡大">+</button>
                        <button class="zbtn" id="zoomFit" title="全体表示 (Shift+F)" aria-label="全体表示">⤢</button>
                    </div>
                    <button class="btn icon-only" id="snapBtn" title="グリッド吸着 ON/OFF" aria-label="グリッド吸着"><span class="ico">🧲</span></button>
                    <button class="btn icon-only" id="layoutBtn" title="自動整列" aria-label="自動整列"><span class="ico">▦</span></button>
                </div>
                <div class="toolbar-group">
                    <button class="btn" id="textBtn" title="テキスト表示・編集（双方向同期）"><span class="ico">&lt;/&gt;</span>テキスト</button>
                    <select class="btn" id="scaleSelect" title="PNG出力解像度" aria-label="PNG解像度" style="padding:6px 9px;">
                        <option value="1">1x</option>
                        <option value="2" selected>2x</option>
                        <option value="3">3x</option>
                        <option value="4">4x</option>
                    </select>
                    <button class="btn" id="svgBtn"><span class="ico">⬇</span>SVG</button>
                    <button class="btn" id="pngBtn"><span class="ico">⬇</span>PNG</button>
                    <button class="btn icon-only" id="copyImgBtn" title="画像をコピー" aria-label="画像をコピー"><span class="ico">🖼</span></button>
                    <button class="btn icon-only" id="shareBtn" title="共有リンクをコピー" aria-label="共有リンク"><span class="ico">🔗</span></button>
                </div>
            </div>
            <div class="canvas-wrap" id="canvasWrap">
                <div class="canvas-area" id="canvasArea">
                    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
                    <div class="canvas-empty" id="emptyState">左のツールでノードを選んでキャンバスをクリック、または上のテンプレートから開始</div>
                </div>
                <div class="text-drawer" id="textDrawer" hidden>
                    <div class="drawer-head">
                        <span>PlantUML風テキスト <em>双方向同期</em></span>
                        <span class="dsl-status" id="dslStatus">OK</span>
                        <button class="btn icon-only" id="dslCopyBtn" title="テキストをコピー"><span class="ico">⧉</span></button>
                        <button class="btn icon-only" id="textCloseBtn" title="閉じる"><span class="ico">✕</span></button>
                    </div>
                    <textarea id="dsl" spellcheck="false" autocapitalize="off" autocorrect="off"
                        placeholder="@startuml&#10;class Foo {&#10;  - bar: int&#10;  + baz(): void&#10;}&#10;Foo --|> Base&#10;@enduml"></textarea>
                </div>
            </div>
        </section>
    </div>

    <div class="toast-host" id="toastHost"></div>

    <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const SVGNS = 'http://www.w3.org/2000/svg';
    const FONT = "-apple-system,'Segoe UI','Noto Sans JP',sans-serif";
    const MFONT = "'SF Mono','Consolas',monospace";

    /* ============================================================
     * 関連タイプ定義（始点=from側 / 終点=to側）
     * ============================================================ */
    const REL = {
        association: { label: '関連',  dash: false, start: 'none',         end: 'none' },
        directed:    { label: '誘導',  dash: false, start: 'none',         end: 'open' },
        inheritance: { label: '継承',  dash: false, start: 'none',         end: 'triangle' },
        realization: { label: '実現',  dash: true,  start: 'none',         end: 'triangle' },
        dependency:  { label: '依存',  dash: true,  start: 'none',         end: 'open' },
        aggregation: { label: '集約',  dash: false, start: 'diamond',      end: 'none' },
        composition: { label: '合成',  dash: false, start: 'diamondFilled', end: 'none' },
        // 他図種用
        transition:  { label: '遷移',  dash: false, start: 'none',         end: 'open' },
        include:     { label: '«include»', dash: true,  start: 'none',     end: 'open' },
        extend:      { label: '«extend»',  dash: true,  start: 'none',     end: 'open' },
        // シーケンス図のメッセージ
        sync:        { label: '同期',  dash: false, start: 'none',         end: 'open' },
        async:       { label: '非同期', dash: false, start: 'none',        end: 'open' },
        reply:       { label: '応答(返り)', dash: true, start: 'none',      end: 'open' }
    };
    const DEFAULT_EDGE_LABEL = { include: '«include»', extend: '«extend»' };

    // 図種ごとの定義（ノード種別 / 関連ツール）
    const DIAGRAMS = {
        class: { label: 'クラス図',
            nodes: [{ kind: 'class', label: 'クラス' }, { kind: 'note', label: 'ノート' }],
            rels: ['association', 'directed', 'inheritance', 'realization', 'dependency', 'aggregation', 'composition'] },
        state: { label: '状態遷移図',
            nodes: [{ kind: 'state', label: '状態' }, { kind: 'initial', label: '開始' }, { kind: 'final', label: '終了' }, { kind: 'note', label: 'ノート' }],
            rels: ['transition'] },
        usecase: { label: 'ユースケース図',
            nodes: [{ kind: 'actor', label: 'アクター' }, { kind: 'usecase', label: 'ユースケース' }, { kind: 'boundary', label: '境界' }, { kind: 'note', label: 'ノート' }],
            rels: ['association', 'directed', 'include', 'extend', 'inheritance'] },
        component: { label: 'コンポーネント図',
            nodes: [{ kind: 'component', label: 'コンポーネント' }, { kind: 'interface', label: 'インタフェース' }, { kind: 'boundary', label: '境界' }, { kind: 'note', label: 'ノート' }],
            rels: ['dependency', 'association', 'directed'] },
        sequence: { label: 'シーケンス図',
            nodes: [{ kind: 'participant', label: 'ライフライン' }, { kind: 'actor', label: 'アクター' }, { kind: 'note', label: 'ノート' }],
            rels: ['sync', 'async', 'reply'] }
    };
    const NODE_LABEL = { class: 'クラス', state: '状態', initial: '開始', final: '終了', actor: 'アクター', usecase: 'ユースケース', boundary: '境界', component: 'コンポーネント', interface: 'インタフェース', participant: 'ライフライン', note: 'ノート' };
    const TOOL_LABEL = { select: '選択' };

    // パレット用の小さなプレビューSVG（ツールid: 'select' / 'add:<kind>' / 'rel:<type>'）
    function toolGlyph(t) {
        if (t === 'select') return '<svg viewBox="0 0 26 16"><path d="M5 2 L5 13 L8 10 L10 14 L12 13 L10 9 L14 9 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></svg>';
        if (t.startsWith('add:')) return nodeGlyph(t.slice(4));
        const id = t.slice(4);
        if (id === 'sync' || id === 'async' || id === 'reply') {
            const dash = id === 'reply' ? 'stroke-dasharray="3 2"' : '';
            let s = `<svg viewBox="0 0 26 16"><line x1="3" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1.3" ${dash}/>`;
            s += id === 'sync' ? '<path d="M21 8 L14 5 L14 11 Z" fill="currentColor"/>' : '<path d="M21 8 L15 5 M21 8 L15 11" stroke="currentColor" stroke-width="1.3" fill="none"/>';
            return s + '</svg>';
        }
        const r = REL[t.slice(4)];
        const dash = r.dash ? 'stroke-dasharray="3 2"' : '';
        let s = `<svg viewBox="0 0 26 16"><line x1="3" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1.3" ${dash}/>`;
        if (r.end === 'open') s += '<path d="M20 8 L15 5 M20 8 L15 11" stroke="currentColor" stroke-width="1.3" fill="none"/>';
        if (r.end === 'triangle') s += '<path class="hollow" d="M23 8 L16 4.5 L16 11.5 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>';
        if (r.start === 'diamond') s += '<path class="hollow" d="M3 8 L7 5.5 L11 8 L7 10.5 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>';
        if (r.start === 'diamondFilled') s += '<path d="M3 8 L7 5.5 L11 8 L7 10.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.3"/>';
        return s + '</svg>';
    }
    function nodeGlyph(kind) {
        const w = 'stroke="currentColor" stroke-width="1.3" fill="none"';
        switch (kind) {
            case 'class': return `<svg viewBox="0 0 26 16"><rect x="4" y="2" width="18" height="12" rx="1" ${w}/><line x1="4" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="1.1"/></svg>`;
            case 'state': return `<svg viewBox="0 0 26 16"><rect x="3" y="3" width="20" height="10" rx="5" ${w}/></svg>`;
            case 'initial': return `<svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="5" fill="currentColor"/></svg>`;
            case 'final': return `<svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="6" ${w}/><circle cx="13" cy="8" r="3" fill="currentColor"/></svg>`;
            case 'actor': return `<svg viewBox="0 0 26 16"><circle cx="13" cy="4" r="2.4" ${w}/><line x1="13" y1="6" x2="13" y2="11" ${w}/><line x1="9" y1="8" x2="17" y2="8" ${w}/><line x1="13" y1="11" x2="10" y2="15" ${w}/><line x1="13" y1="11" x2="16" y2="15" ${w}/></svg>`;
            case 'usecase': return `<svg viewBox="0 0 26 16"><ellipse cx="13" cy="8" rx="10" ry="6" ${w}/></svg>`;
            case 'boundary': return `<svg viewBox="0 0 26 16"><rect x="3" y="2" width="20" height="12" rx="1" stroke="currentColor" stroke-width="1.3" fill="none" stroke-dasharray="3 2"/></svg>`;
            case 'component': return `<svg viewBox="0 0 26 16"><rect x="5" y="3" width="16" height="10" ${w}/><rect x="3" y="5" width="4" height="2.4" ${w}/><rect x="3" y="9" width="4" height="2.4" ${w}/></svg>`;
            case 'interface': return `<svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="5" ${w}/></svg>`;
            case 'participant': return `<svg viewBox="0 0 26 16"><rect x="7" y="1" width="12" height="6" ${w}/><line x1="13" y1="7" x2="13" y2="15" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2 2"/></svg>`;
            case 'note': return `<svg viewBox="0 0 26 16"><path d="M4 2 L18 2 L22 6 L22 14 L4 14 Z" ${w}/><path d="M18 2 L18 6 L22 6" ${w}/></svg>`;
        }
        return `<svg viewBox="0 0 26 16"><rect x="4" y="3" width="18" height="10" ${w}/></svg>`;
    }
    // 関連ツールid → 実際のエッジtype（現状は同一だが将来の別名用）
    function relType(id) { return id; }

    /* ============================================================
     * State / Project（図種ごとに独立したダイアグラムを保持）
     * ============================================================ */
    function emptyDiagramFor(t) { return t === 'sequence' ? { participants: [], messages: [], fragments: [], notes: [] } : { nodes: [], edges: [] }; }
    let project = { type: 'class', diagrams: {} };
    for (const t in { class: 1, state: 1, usecase: 1, component: 1, sequence: 1 }) project.diagrams[t] = emptyDiagramFor(t);
    let state = project.diagrams.class;   // アクティブなダイアグラム
    function diagramType() { return project.type; }
    function isSeq() { return project.type === 'sequence'; }
    let selection = null;          // {kind:'node'|'edge', id}  ← プロパティ表示用の主選択
    let selNodes = new Set();      // 複数選択中のノードid
    let clipboard = null;          // コピーしたノード群
    let snapOn = false;            // グリッド吸着
    const GRID = 10;
    let mode = 'select';
    const view = { tx: 60, ty: 60, s: 1 };
    let seq = 1;
    const LS_KEY = 'uml_class_editor_v1';
    const LS_THEME = 'uml_theme';
    let theme = localStorage.getItem(LS_THEME) || 'light';

    const canvas = $('canvas');
    const viewG = el('g', { id: 'view' });               // pan/zoom layer
    const edgesLayer = el('g', { id: 'edges' });
    const nodesLayer = el('g', { id: 'nodes' });
    const overlay = el('g', { id: 'overlay' });          // 一時線など
    viewG.append(edgesLayer, nodesLayer, overlay);
    canvas.append(viewG);

    function el(name, attrs) {
        const e = document.createElementNS(SVGNS, name);
        if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
    }
    function uid(p) { return p + (seq++); }

    /* ---- text measuring ---- */
    const mctx = document.createElement('canvas').getContext('2d');
    function measure(text, font) { mctx.font = font; return mctx.measureText(text).width; }

    /* ============================================================
     * Node layout
     * ============================================================ */
    const PADX = 12, LINE = 18, NAMEH = 22;
    function layoutNode(n) {
        const kind = n.kind || 'class';
        const titleFont = "600 13px " + FONT;
        if (kind === 'class') {
            const nameFont = "600 14px " + FONT, stereoFont = "italic 12px " + FONT, memFont = "13px " + MFONT;
            const attrs = n.attributes || [], methods = n.methods || [];
            let maxW = measure(n.name || 'Class', nameFont);
            if (n.stereotype) maxW = Math.max(maxW, measure('«' + n.stereotype + '»', stereoFont));
            for (const a of attrs) maxW = Math.max(maxW, measure(a, memFont));
            for (const m of methods) maxW = Math.max(maxW, measure(m, memFont));
            n.w = Math.max(130, Math.ceil(maxW) + PADX * 2);
            const headH = (n.stereotype ? 16 : 0) + NAMEH + 8;
            n._headH = headH; n._attrH = attrs.length ? attrs.length * LINE + 8 : 12; n._methH = methods.length ? methods.length * LINE + 8 : 12;
            n.h = headH + n._attrH + n._methH;
        } else if (kind === 'initial') { n.w = 20; n.h = 20; }
        else if (kind === 'final') { n.w = 26; n.h = 26; }
        else if (kind === 'actor') { n.w = Math.max(40, measure(n.name || 'Actor', titleFont)); n.h = 64; }
        else if (kind === 'usecase') { const tw = measure(n.name || 'UseCase', titleFont); n.w = Math.max(110, Math.ceil(tw) + 44); n.h = 56; }
        else if (kind === 'boundary') { n.w = Math.max(160, n.w || 280); n.h = Math.max(120, n.h || 200); }
        else if (kind === 'component') { const tw = measure(n.name || 'Component', titleFont); n.w = Math.max(150, Math.ceil(tw) + 56); n.h = 58; }
        else if (kind === 'interface') { const tw = measure(n.name || 'Interface', titleFont); n.w = Math.max(96, Math.ceil(tw) + 30); n.h = 58; }
        else if (kind === 'note') {
            const nf = "12px " + FONT, ls = (n.text || '').split('\n');
            let mw = 40; ls.forEach(l => mw = Math.max(mw, measure(l, nf)));
            n.w = Math.max(80, Math.ceil(mw) + 22); n.h = Math.max(32, ls.length * 16 + 14);
        }
        else { n.w = Math.max(110, measure(n.name || '', titleFont) + 24); n.h = 48; }
    }

    /* ============================================================
     * Render
     * ============================================================ */
    let rafPending = false;
    function scheduleRender() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => { rafPending = false; render(); });
    }

    function render() {
        if (isSeq()) return renderSequence();
        state.nodes.forEach(layoutNode);
        // edges first (under nodes)
        const ef = document.createDocumentFragment();
        for (const e of state.edges) { const g = drawEdge(e); if (g) ef.append(g); }
        edgesLayer.replaceChildren(ef);
        const nf = document.createDocumentFragment();
        for (const n of state.nodes) nf.append(drawNode(n));
        nodesLayer.replaceChildren(nf);
        applyView();
        $('emptyState').classList.toggle('hidden', state.nodes.length > 0);
        $('countLabel').textContent = `${state.nodes.length} ノード / ${state.edges.length} 関連`;
        $('undoBtn').disabled = !history.length;
        $('redoBtn').disabled = !future.length;
        syncTextFromDiagram();
    }

    function drawNode(n) {
        const cls = 'node' + (isSel('node', n.id) ? ' selected' : '') + (selNodes.has(n.id) && !isSel('node', n.id) ? ' multi' : '');
        const g = el('g', { class: cls, transform: `translate(${n.x},${n.y})` });
        g.dataset.node = n.id;
        const kind = n.kind || 'class';
        const W = n.w, H = n.h, cx = W / 2, cy = H / 2;

        if (kind === 'class') {
            g.append(el('rect', { class: 'node-rect', x: 0, y: 0, width: W, height: H, rx: 3 }));
            g.append(el('rect', { class: 'node-head', x: 1, y: 1, width: W - 2, height: n._headH - 1, rx: 2 }));
            if (n.stereotype) g.append(text(cx, 14, '«' + n.stereotype + '»', 'node-stereo', 'middle'));
            g.append(text(cx, n.stereotype ? 14 + NAMEH - 6 : NAMEH - 2, n.name || 'Class', 'node-name', 'middle'));
            g.append(el('line', { class: 'compartment-sep', x1: 0, y1: n._headH, x2: W, y2: n._headH }));
            let ay = n._headH + 14;
            for (const a of (n.attributes || [])) { g.append(text(PADX, ay, a, 'node-member', 'start')); ay += LINE; }
            g.append(el('line', { class: 'compartment-sep', x1: 0, y1: n._headH + n._attrH, x2: W, y2: n._headH + n._attrH }));
            let my = n._headH + n._attrH + 14;
            for (const m of (n.methods || [])) { g.append(text(PADX, my, m, 'node-member', 'start')); my += LINE; }
        } else if (kind === 'state') {
            g.append(el('rect', { class: 'shape', x: 0, y: 0, width: W, height: H, rx: 12, ry: 12 }));
            g.append(text(cx, cy + 4, n.name || 'State', 'node-title', 'middle'));
        } else if (kind === 'initial') {
            g.append(el('circle', { class: 'pseudo-fill', cx, cy, r: W / 2 - 1 }));
        } else if (kind === 'final') {
            g.append(el('circle', { class: 'pseudo-ring', cx, cy, r: W / 2 - 1 }));
            g.append(el('circle', { class: 'pseudo-fill', cx, cy, r: W / 2 - 6 }));
        } else if (kind === 'actor') {
            const hx = cx, r = 7;
            g.append(el('circle', { class: 'actor-head', cx: hx, cy: r + 2, r }));
            g.append(el('line', { class: 'actor-stroke', x1: hx, y1: r * 2 + 2, x2: hx, y2: 36 }));
            g.append(el('line', { class: 'actor-stroke', x1: hx - 12, y1: 26, x2: hx + 12, y2: 26 }));
            g.append(el('line', { class: 'actor-stroke', x1: hx, y1: 36, x2: hx - 11, y2: 50 }));
            g.append(el('line', { class: 'actor-stroke', x1: hx, y1: 36, x2: hx + 11, y2: 50 }));
            g.append(text(cx, 62, n.name || 'Actor', 'node-title', 'middle'));
        } else if (kind === 'usecase') {
            g.append(el('ellipse', { class: 'shape', cx, cy, rx: W / 2, ry: H / 2 }));
            g.append(text(cx, cy + 4, n.name || 'UseCase', 'node-title', 'middle'));
        } else if (kind === 'boundary') {
            g.append(el('rect', { class: 'boundary-rect', x: 0, y: 0, width: W, height: H, rx: 4 }));
            g.append(text(12, 20, n.name || 'System', 'boundary-title', 'start'));
        } else if (kind === 'component') {
            g.append(el('rect', { class: 'shape', x: 0, y: 0, width: W, height: H, rx: 2 }));
            g.append(el('rect', { class: 'comp-icon', x: W - 22, y: 8, width: 14, height: 10 }));
            g.append(el('rect', { class: 'comp-icon', x: W - 26, y: 10, width: 6, height: 2.5 }));
            g.append(el('rect', { class: 'comp-icon', x: W - 26, y: 14, width: 6, height: 2.5 }));
            g.append(text(cx, cy - 4, '«component»', 'node-sub', 'middle'));
            g.append(text(cx, cy + 13, n.name || 'Component', 'node-title', 'middle'));
        } else if (kind === 'interface') {
            g.append(el('circle', { class: 'shape', cx, cy: 18, r: 14 }));
            g.append(text(cx, 50, n.name || 'Interface', 'node-title', 'middle'));
        } else if (kind === 'note') {
            const fold = 12;
            g.append(el('path', { class: 'note-rect', d: `M0,0 L${W - fold},0 L${W},${fold} L${W},${H} L0,${H} Z` }));
            g.append(el('path', { class: 'note-fold', d: `M${W - fold},0 L${W - fold},${fold} L${W},${fold}` }));
            (n.text || '').split('\n').forEach((l, i) => g.append(text(8, 16 + i * 16, l, 'note-text', 'start')));
        }
        return g;
    }

    function text(x, y, str, cls, anchor) {
        const t = el('text', { x, y, class: cls, 'text-anchor': anchor || 'start' });
        t.textContent = str;
        return t;
    }

    /* ---- vector helpers ---- */
    const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
    const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
    const len = v => Math.hypot(v.x, v.y) || 1;
    const unit = v => mul(v, 1 / len(v));
    const perp = v => ({ x: -v.y, y: v.x });
    const center = n => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 });

    function borderPoint(n, toward) {
        const c = center(n);
        const d = sub(toward, c);
        if (!d.x && !d.y) return c;
        const sx = d.x !== 0 ? (n.w / 2) / Math.abs(d.x) : Infinity;
        const sy = d.y !== 0 ? (n.h / 2) / Math.abs(d.y) : Infinity;
        const s = Math.min(sx, sy);
        return { x: c.x + d.x * s, y: c.y + d.y * s };
    }

    function drawEdge(e) {
        const a = nodeById(e.from), b = nodeById(e.to);
        if (!a || !b) return null;
        const r = REL[e.type] || REL.association;
        let pA = borderPoint(a, center(b));
        let pB = borderPoint(b, center(a));
        const dirEnd = unit(sub(pB, pA));     // points toward B
        const dirStart = mul(dirEnd, -1);     // points toward A
        // shorten line so triangle/diamond don't overlap
        const startShorten = (r.start === 'diamond' || r.start === 'diamondFilled') ? 16 : 0;
        const endShorten = (r.end === 'triangle') ? 14 : 0;
        const lA = add(pA, mul(dirEnd, startShorten));
        const lB = add(pB, mul(dirStart, endShorten));

        const g = el('g', { class: 'edge' + (isSel('edge', e.id) ? ' selected' : '') });
        g.dataset.edge = e.id;
        g.append(el('line', { class: 'edge-hit', x1: pA.x, y1: pA.y, x2: pB.x, y2: pB.y }));
        const line = el('line', { class: 'edge-line', x1: lA.x, y1: lA.y, x2: lB.x, y2: lB.y });
        if (r.dash) line.setAttribute('stroke-dasharray', '7 5');
        g.append(line);

        if (r.end !== 'none') g.append(marker(pB, dirEnd, r.end));
        if (r.start !== 'none') g.append(marker(pA, dirStart, r.start));

        // labels
        if (e.fromMult) g.append(edgeLabel(offsetLabel(pA, dirEnd, 16), e.fromMult));
        if (e.toMult) g.append(edgeLabel(offsetLabel(pB, dirStart, 16), e.toMult));
        if (e.label) {
            const mid = { x: (pA.x + pB.x) / 2, y: (pA.y + pB.y) / 2 };
            g.append(edgeLabel({ x: mid.x, y: mid.y - 6 }, e.label, true));
        }
        return g;
    }

    function offsetLabel(p, dirAlong, d) {
        // 線に沿って少し内側、かつ少し上にずらす
        const along = mul(dirAlong, d);
        return { x: p.x + along.x + 4, y: p.y + along.y - 4 };
    }

    function edgeLabel(p, str, mid) {
        const g = el('g');
        const w = measure(str, "12px " + FONT) + 6;
        g.append(el('rect', { class: 'edge-label-bg', x: p.x - (mid ? w / 2 : 0), y: p.y - 11, width: w, height: 14, rx: 2 }));
        g.append(text(p.x + (mid ? 0 : 3), p.y, str, 'edge-label', mid ? 'middle' : 'start'));
        return g;
    }

    function marker(tip, dir, type) {
        const p = perp(dir);
        if (type === 'open') {
            const m = 12, hw = 6;
            const base = sub(tip, mul(dir, m));
            const a = add(base, mul(p, hw)), b = sub(base, mul(p, hw));
            return el('path', { class: 'marker-open', d: `M${a.x},${a.y} L${tip.x},${tip.y} L${b.x},${b.y}` });
        }
        if (type === 'triangle') {
            const m = 14, hw = 7;
            const base = sub(tip, mul(dir, m));
            const a = add(base, mul(p, hw)), b = sub(base, mul(p, hw));
            return el('path', { class: 'marker-hollow', d: `M${tip.x},${tip.y} L${a.x},${a.y} L${b.x},${b.y} Z` });
        }
        // diamonds
        const m = 16, hw = 7;
        const back = sub(tip, mul(dir, m));
        const midp = sub(tip, mul(dir, m / 2));
        const a = add(midp, mul(p, hw)), b = sub(midp, mul(p, hw));
        const cls = type === 'diamondFilled' ? 'marker-filled' : 'marker-hollow';
        return el('path', { class: cls, d: `M${tip.x},${tip.y} L${a.x},${a.y} L${back.x},${back.y} L${b.x},${b.y} Z` });
    }

    /* ============================================================
     * シーケンス図エンジン（時間軸ベース）
     * ============================================================ */
    const SEQ = { headTop: 20, headH: 42, gap: 70, firstMsg: 40, rowGap: 46, selfW: 42 };
    function seqLayout() {
        const ps = state.participants || [], msgs = state.messages || [];
        const titleFont = "600 13px " + FONT;
        const cx = new Map(), boxW = new Map();
        let prevX = null, prevHalf = 0;
        ps.forEach((p, i) => {
            const w = Math.max(84, Math.ceil(measure(p.name || 'Object', titleFont)) + 24);
            boxW.set(p.id, w);
            const x = i === 0 ? 40 + w / 2 : prevX + prevHalf + SEQ.gap + w / 2;
            cx.set(p.id, x); prevX = x; prevHalf = w / 2;
        });
        const lifeTop = SEQ.headTop + SEQ.headH;
        const firstMsgY = lifeTop + SEQ.firstMsg;
        const bottomY = firstMsgY + Math.max(1, msgs.length) * SEQ.rowGap + 10;
        let minX = Infinity, maxX = -Infinity;
        ps.forEach(p => { const x = cx.get(p.id), w = boxW.get(p.id); minX = Math.min(minX, x - w / 2); maxX = Math.max(maxX, x + w / 2 + (msgs.some(m => m.from === p.id && m.to === p.id) ? SEQ.selfW : 0)); });
        if (!ps.length) { minX = 0; maxX = 200; }
        let by = bottomY;
        for (const nt of (state.notes || [])) { minX = Math.min(minX, nt.x); maxX = Math.max(maxX, nt.x + 140); by = Math.max(by, nt.y + 60); }
        return { ps, msgs, cx, boxW, lifeTop, firstMsgY, bottomY: by, minX, maxX };
    }

    function seqArrow(x, y, dir, type) {
        const L = 11, W = 4;
        if (type === 'sync') return el('path', { class: 'seq-arrow-filled', d: `M${x},${y} L${x - dir * L},${y - W} L${x - dir * L},${y + W} Z` });
        return el('path', { class: 'seq-arrow-open', d: `M${x - dir * L},${y - W} L${x},${y} L${x - dir * L},${y + W}` });
    }

    // 同期呼び出し→応答 の対応から実行仕様バーを自動算出
    function computeActivations(L) {
        const acts = [], stacks = {};
        L.msgs.forEach((m, i) => {
            const y = L.firstMsgY + i * SEQ.rowGap;
            if (m.type === 'sync') { (stacks[m.to] || (stacks[m.to] = [])).push({ y1: y, depth: (stacks[m.to].length) }); }
            else if (m.type === 'reply') { const st = stacks[m.from]; if (st && st.length) { const a = st.pop(); acts.push({ part: m.from, y1: a.y1, y2: y, depth: a.depth }); } }
        });
        for (const part in stacks) for (const a of stacks[part]) acts.push({ part, y1: a.y1, y2: L.bottomY - 8, depth: a.depth });
        return acts;
    }

    function fragGeom(L, f) {
        const idx = id => L.msgs.findIndex(m => m.id === id);
        let i1 = idx(f.from), i2 = idx(f.to);
        if (i1 < 0 || i2 < 0) return null;
        if (i1 > i2) { const t = i1; i1 = i2; i2 = t; }
        let minX = Infinity, maxX = -Infinity, hasSelf = false;
        for (let i = i1; i <= i2; i++) {
            const m = L.msgs[i], xa = L.cx.get(m.from), xb = L.cx.get(m.to);
            if (xa == null || xb == null) continue;
            minX = Math.min(minX, xa, xb); maxX = Math.max(maxX, xa, xb);
            if (m.from === m.to) hasSelf = true;
        }
        if (!isFinite(minX)) return null;
        minX -= 34; maxX += 34 + (hasSelf ? SEQ.selfW : 0);
        return { x: minX, y: L.firstMsgY + i1 * SEQ.rowGap - SEQ.rowGap * 0.7, w: maxX - minX, h: (i2 - i1) * SEQ.rowGap + SEQ.rowGap * 1.15 };
    }

    function addFragment() {
        const msgs = state.messages || [];
        if (!msgs.length) return toast('先にメッセージを追加してください', true);
        commit();
        (state.fragments || (state.fragments = [])).push({ id: uid('f'), type: 'opt', label: '', from: msgs[0].id, to: msgs[msgs.length - 1].id, elseAfter: '', elseLabel: '' });
        select('frag', state.fragments[state.fragments.length - 1].id);
        render(); save();
    }

    function seqActorHead(g, x, top, name) {
        const cyh = top + 7;
        g.append(el('circle', { class: 'actor-head', cx: x, cy: cyh, r: 6 }));
        g.append(el('line', { class: 'actor-stroke', x1: x, y1: cyh + 6, x2: x, y2: top + 28 }));
        g.append(el('line', { class: 'actor-stroke', x1: x - 10, y1: top + 18, x2: x + 10, y2: top + 18 }));
        g.append(el('line', { class: 'actor-stroke', x1: x, y1: top + 28, x2: x - 9, y2: top + 40 }));
        g.append(el('line', { class: 'actor-stroke', x1: x, y1: top + 28, x2: x + 9, y2: top + 40 }));
    }

    function renderSequence() {
        const L = seqLayout();
        const frag = document.createDocumentFragment();
        // ライフライン + ヘッダ
        for (const p of L.ps) {
            const x = L.cx.get(p.id), w = L.boxW.get(p.id);
            const g = el('g', { class: 'seq-part' + (isSel('part', p.id) ? ' selected' : '') });
            g.dataset.part = p.id;
            g.append(el('line', { class: 'seq-life', x1: x, y1: L.lifeTop, x2: x, y2: L.bottomY }));
            if (p.kind === 'actor') {
                seqActorHead(g, x, SEQ.headTop, p.name);
                g.append(text(x, SEQ.headTop + SEQ.headH - 1, p.name || 'Actor', 'node-title', 'middle'));
            } else {
                g.append(el('rect', { class: 'shape', x: x - w / 2, y: SEQ.headTop, width: w, height: SEQ.headH, rx: 3 }));
                g.append(text(x, SEQ.headTop + SEQ.headH / 2 + 4, p.name || 'Object', 'node-title', 'middle'));
            }
            g.append(el('rect', { class: 'seq-hit', x: x - w / 2, y: SEQ.headTop, width: w, height: SEQ.headH }));
            frag.append(g);
        }
        // 複合フラグメント（メッセージの背面に枠）
        for (const f of (state.fragments || [])) {
            const g = fragGeom(L, f); if (!g) continue;
            const grp = el('g', { class: 'seq-frag' + (isSel('frag', f.id) ? ' selected' : '') });
            grp.dataset.frag = f.id;
            grp.append(el('rect', { class: 'frag-rect', x: g.x, y: g.y, width: g.w, height: g.h, rx: 2 }));
            const head = f.type + (f.label ? ` [${f.label}]` : '');
            const tw = Math.max(38, Math.ceil(measure(head, "600 11px " + FONT)) + 16), th = 17;
            grp.append(el('path', { class: 'frag-tab', d: `M${g.x},${g.y} h${tw} v${th - 5} l-5,5 h${-(tw - 5)} Z` }));
            grp.append(text(g.x + 7, g.y + 12, head, 'frag-tab-text', 'start'));
            if (f.type === 'alt' && f.elseAfter) {
                const ei = L.msgs.findIndex(m => m.id === f.elseAfter);
                if (ei >= 0) {
                    const ey = L.firstMsgY + ei * SEQ.rowGap + SEQ.rowGap * 0.5;
                    grp.append(el('line', { class: 'frag-else', x1: g.x, y1: ey, x2: g.x + g.w, y2: ey }));
                    grp.append(text(g.x + 8, ey - 3, '[else]' + (f.elseLabel ? ' ' + f.elseLabel : ''), 'frag-tab-text', 'start'));
                }
            }
            frag.append(grp);
        }
        // 実行仕様バー（activation）
        for (const a of computeActivations(L)) {
            const x = L.cx.get(a.part); if (x == null) continue;
            frag.append(el('rect', { class: 'seq-activation', x: x - 5 + a.depth * 5, y: a.y1, width: 10, height: Math.max(6, a.y2 - a.y1) }));
        }
        // メッセージ（時間順に上から）
        L.msgs.forEach((m, i) => {
            const xa = L.cx.get(m.from), xb = L.cx.get(m.to);
            if (xa == null || xb == null) return;
            const y = L.firstMsgY + i * SEQ.rowGap;
            const g = el('g', { class: 'seq-msg' + (isSel('msg', m.id) ? ' selected' : '') });
            g.dataset.msg = m.id;
            const dashed = m.type === 'reply' ? ' dashed' : '';
            if (m.from === m.to) {                        // 自己メッセージ
                const dy = SEQ.rowGap * 0.5;
                g.append(el('path', { class: 'seq-line' + dashed, d: `M${xa},${y} h${SEQ.selfW} v${dy} h${-SEQ.selfW}` }));
                g.append(seqArrow(xa, y + dy, -1, m.type));
                g.append(text(xa + SEQ.selfW + 6, y - 3, m.text || '', 'seq-label', 'start'));
            } else {
                const dir = xb > xa ? 1 : -1;
                g.append(el('line', { class: 'seq-line' + dashed, x1: xa, y1: y, x2: xb, y2: y }));
                g.append(seqArrow(xb, y, dir, m.type));
                g.append(text((xa + xb) / 2, y - 6, m.text || '', 'seq-label', 'middle'));
            }
            const hx1 = Math.min(xa, xb) - 12, hx2 = Math.max(xa, xb) + 12;
            g.append(el('rect', { class: 'seq-hit', x: hx1, y: y - SEQ.rowGap / 2, width: hx2 - hx1, height: SEQ.rowGap }));
            frag.append(g);
        });
        // ノート（最前面・ドラッグ可）
        const nf = "12px " + FONT, fold = 12;
        for (const nt of (state.notes || [])) {
            const ls = (nt.text || '').split('\n');
            let mw = 40; ls.forEach(l => mw = Math.max(mw, measure(l, nf)));
            const W = Math.max(80, Math.ceil(mw) + 22), H = Math.max(32, ls.length * 16 + 14);
            const g = el('g', { class: 'seq-note' + (isSel('snote', nt.id) ? ' selected' : ''), transform: `translate(${nt.x},${nt.y})` });
            g.dataset.snote = nt.id;
            g.append(el('path', { class: 'note-rect', d: `M0,0 L${W - fold},0 L${W},${fold} L${W},${H} L0,${H} Z` }));
            g.append(el('path', { class: 'note-fold', d: `M${W - fold},0 L${W - fold},${fold} L${W},${fold}` }));
            ls.forEach((l, i) => g.append(text(8, 16 + i * 16, l, 'note-text', 'start')));
            frag.append(g);
        }
        edgesLayer.replaceChildren();
        nodesLayer.replaceChildren(frag);
        applyView();
        $('emptyState').classList.toggle('hidden', L.ps.length > 0);
        $('countLabel').textContent = `${L.ps.length} ライフライン / ${L.msgs.length} メッセージ`;
        $('undoBtn').disabled = !history.length; $('redoBtn').disabled = !future.length;
    }

    function nearestParticipant(px) {
        const L = seqLayout(); let best = null, bd = Infinity;
        for (const p of L.ps) { const d = Math.abs(L.cx.get(p.id) - px); if (d < bd) { bd = d; best = p.id; } }
        return bd < 90 ? best : null;
    }
    function createParticipant(kind) {
        commit();
        const n = (state.participants.length) + 1;
        const p = { id: uid('p'), kind, name: kind === 'actor' ? 'Actor' : 'Object' + n };
        state.participants.push(p);
        setMode('select'); select('part', p.id);
        render(); save();
        const f = $('f_name'); if (f) { f.focus(); f.select(); }
    }
    function addMessage(from, to, type) {
        commit();
        const m = { id: uid('m'), from, to, type, text: '' };
        state.messages.push(m);
        setMode('select'); select('msg', m.id);
        render(); save();
    }
    function createSeqNote(x, y) {
        commit();
        const nt = { id: uid('s'), x: Math.round(x - 50), y: Math.round(y - 20), text: 'メモ' };
        (state.notes || (state.notes = [])).push(nt);
        setMode('select'); select('snote', nt.id);
        render(); save();
        const f = $('f_text'); if (f) { f.focus(); f.select(); }
    }
    function moveItem(arr, id, dir) {
        const i = arr.findIndex(o => o.id === id); if (i < 0) return;
        const j = i + dir; if (j < 0 || j >= arr.length) return;
        commit(); [arr[i], arr[j]] = [arr[j], arr[i]]; render(); renderPanel(); save();
    }

    function seqPointerDown(e) {
        const partEl = e.target.closest('[data-part]'), msgEl = e.target.closest('[data-msg]'), noteEl = e.target.closest('[data-snote]');
        const pt = toDiagram(e.clientX, e.clientY);
        if (mode.startsWith('add:')) {
            const k = mode.slice(4);
            if (k === 'note') { createSeqNote(pt.x, pt.y); return; }
            if (!partEl) { createParticipant(k); return; }
        }
        if (mode.startsWith('rel:')) {
            if (partEl) {
                const x = seqLayout().cx.get(partEl.dataset.part);
                drag = { kind: 'seqmsg', from: partEl.dataset.part, rel: mode.slice(4), temp: el('line', { class: 'temp-line' }) };
                drag.temp.setAttribute('x1', x); drag.temp.setAttribute('y1', pt.y);
                drag.temp.setAttribute('x2', pt.x); drag.temp.setAttribute('y2', pt.y);
                overlay.append(drag.temp); canvas.setPointerCapture(e.pointerId);
            }
            return;
        }
        const fragEl = e.target.closest('[data-frag]');
        if (noteEl) {
            const nt = (state.notes || []).find(o => o.id === noteEl.dataset.snote);
            select('snote', noteEl.dataset.snote);
            if (nt) { drag = { kind: 'seqnote', id: nt.id, dx: pt.x - nt.x, dy: pt.y - nt.y, moved: false }; canvas.setPointerCapture(e.pointerId); }
        }
        else if (partEl) select('part', partEl.dataset.part);
        else if (msgEl) select('msg', msgEl.dataset.msg);
        else if (fragEl) select('frag', fragEl.dataset.frag);
        else { select(null); drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, ox: view.tx, oy: view.ty }; canvas.setPointerCapture(e.pointerId); }
    }
    function seqPointerMove(e) {
        if (!drag) return;
        if (drag.kind === 'pan') { view.tx = drag.ox + (e.clientX - drag.sx); view.ty = drag.oy + (e.clientY - drag.sy); applyView(); }
        else if (drag.kind === 'seqmsg') { const pt = toDiagram(e.clientX, e.clientY); drag.temp.setAttribute('x2', pt.x); drag.temp.setAttribute('y2', pt.y); }
        else if (drag.kind === 'seqnote') { const pt = toDiagram(e.clientX, e.clientY); const nt = state.notes.find(o => o.id === drag.id); if (nt) { nt.x = snapv(pt.x - drag.dx); nt.y = snapv(pt.y - drag.dy); drag.moved = true; renderSequence(); } }
    }
    function seqPointerUp(e) {
        if (!drag) return;
        if (drag.kind === 'seqmsg') {
            drag.temp.remove();
            const pt = toDiagram(e.clientX, e.clientY);
            const target = nearestParticipant(pt.x);
            if (target) addMessage(drag.from, target, drag.rel);
        } else if (drag.kind === 'seqnote' && drag.moved) { commit(); save(); }
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        drag = null;
    }

    /* ============================================================
     * View transform
     * ============================================================ */
    function applyView() { viewG.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.s})`); $('zoomLevel').textContent = Math.round(view.s * 100) + '%'; }
    function toDiagram(cx, cy) {
        const r = canvas.getBoundingClientRect();
        return { x: (cx - r.left - view.tx) / view.s, y: (cy - r.top - view.ty) / view.s };
    }
    function zoomAt(factor, cx, cy) {
        const ns = Math.max(0.15, Math.min(4, view.s * factor));
        const k = ns / view.s;
        view.tx = cx - (cx - view.tx) * k;
        view.ty = cy - (cy - view.ty) * k;
        view.s = ns; applyView();
    }
    $('zoomIn').onclick = () => zoomAt(1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
    $('zoomOut').onclick = () => zoomAt(1 / 1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
    $('zoomFit').onclick = fitView;

    function bbox() {
        if (isSeq()) { const L = seqLayout(); return { x: L.minX - 20, y: 0, w: (L.maxX - L.minX) + 40, h: L.bottomY + 20 }; }
        if (!state.nodes.length) return { x: 0, y: 0, w: 400, h: 300 };
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const n of state.nodes) { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); }
        return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
    function fitView() {
        if (!isSeq()) state.nodes.forEach(layoutNode);
        const b = bbox(), pad = 40;
        const aw = canvas.clientWidth - pad * 2, ah = canvas.clientHeight - pad * 2;
        view.s = Math.max(0.15, Math.min(aw / b.w, ah / b.h, 1.5));
        view.tx = pad + (aw - b.w * view.s) / 2 - b.x * view.s;
        view.ty = pad + (ah - b.h * view.s) / 2 - b.y * view.s;
        applyView();
    }

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    /* ============================================================
     * Pointer interaction
     * ============================================================ */
    let drag = null; // {kind, ...}
    canvas.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        if (isSeq()) { seqPointerDown(e); return; }
        const nodeEl = e.target.closest('[data-node]');
        const edgeEl = e.target.closest('[data-edge]');
        const pt = toDiagram(e.clientX, e.clientY);

        if (mode.startsWith('add:') && !nodeEl) { createNode(mode.slice(4), pt.x, pt.y); return; }

        if (mode.startsWith('rel:')) {
            // relationship: must start on a node
            if (nodeEl) {
                drag = { kind: 'edge', from: nodeEl.dataset.node, rel: mode.slice(4), temp: el('line', { class: 'temp-line' }) };
                const c = center(nodeById(drag.from));
                drag.temp.setAttribute('x1', c.x); drag.temp.setAttribute('y1', c.y);
                drag.temp.setAttribute('x2', pt.x); drag.temp.setAttribute('y2', pt.y);
                overlay.append(drag.temp);
                canvas.setPointerCapture(e.pointerId);
            }
            return;
        }

        // select mode
        if (nodeEl) {
            const id = nodeEl.dataset.node;
            if (e.shiftKey) {                       // 複数選択トグル
                if (selNodes.has(id)) selNodes.delete(id); else selNodes.add(id);
                selection = selNodes.size ? { kind: 'node', id } : null;
                refreshSelectionStyles(); renderPanel();
                return;
            }
            if (!selNodes.has(id)) selNodes = new Set([id]);   // 単独選択（グループ内ならグループ維持）
            selection = { kind: 'node', id };
            refreshSelectionStyles(); renderPanel();
            const start = {}; selNodes.forEach(nid => { const nn = nodeById(nid); start[nid] = { x: nn.x, y: nn.y }; });
            drag = { kind: 'node', ids: [...selNodes], start, ox: pt.x, oy: pt.y, moved: false };
            canvas.setPointerCapture(e.pointerId);
        } else if (edgeEl) {
            selNodes = new Set();
            select('edge', edgeEl.dataset.edge);
        } else if (e.shiftKey) {                    // 範囲選択（マーキー）
            const m = el('rect', { class: 'marquee' });
            overlay.append(m);
            drag = { kind: 'marquee', ox: pt.x, oy: pt.y, rect: m, box: null };
            canvas.setPointerCapture(e.pointerId);
        } else {
            selNodes = new Set();
            select(null);
            drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, ox: view.tx, oy: view.ty };
            canvas.setPointerCapture(e.pointerId);
        }
    });

    const snapv = v => snapOn ? Math.round(v / GRID) * GRID : Math.round(v);

    canvas.addEventListener('pointermove', e => {
        if (!drag) return;
        if (isSeq()) { seqPointerMove(e); return; }
        if (drag.kind === 'pan') {
            view.tx = drag.ox + (e.clientX - drag.sx);
            view.ty = drag.oy + (e.clientY - drag.sy);
            applyView();
        } else if (drag.kind === 'node') {
            const pt = toDiagram(e.clientX, e.clientY);
            const dx = pt.x - drag.ox, dy = pt.y - drag.oy;
            for (const id of drag.ids) { const nn = nodeById(id), s = drag.start[id]; nn.x = snapv(s.x + dx); nn.y = snapv(s.y + dy); }
            drag.moved = true;
            scheduleRender();
        } else if (drag.kind === 'edge') {
            const pt = toDiagram(e.clientX, e.clientY);
            drag.temp.setAttribute('x2', pt.x); drag.temp.setAttribute('y2', pt.y);
        } else if (drag.kind === 'marquee') {
            const pt = toDiagram(e.clientX, e.clientY);
            const x = Math.min(pt.x, drag.ox), y = Math.min(pt.y, drag.oy), w = Math.abs(pt.x - drag.ox), h = Math.abs(pt.y - drag.oy);
            drag.rect.setAttribute('x', x); drag.rect.setAttribute('y', y);
            drag.rect.setAttribute('width', w); drag.rect.setAttribute('height', h);
            drag.box = { x, y, w, h };
        }
    });

    canvas.addEventListener('pointerup', e => {
        if (!drag) return;
        if (isSeq()) { seqPointerUp(e); return; }
        if (drag.kind === 'edge') {
            drag.temp.remove();
            const tEl = document.elementFromPoint(e.clientX, e.clientY);
            const targetNode = tEl && tEl.closest && tEl.closest('[data-node]');
            if (targetNode && targetNode.dataset.node !== drag.from) {
                createEdge(drag.from, targetNode.dataset.node, drag.rel);
            }
        } else if (drag.kind === 'node' && drag.moved) {
            commit(); save();
        } else if (drag.kind === 'marquee') {
            drag.rect.remove();
            const b = drag.box;
            if (b && b.w > 3 && b.h > 3) {
                selNodes = new Set(state.nodes.filter(n => n.x < b.x + b.w && n.x + n.w > b.x && n.y < b.y + b.h && n.y + n.h > b.y).map(n => n.id));
                const arr = [...selNodes];
                selection = arr.length ? { kind: 'node', id: arr[arr.length - 1] } : null;
                refreshSelectionStyles(); renderPanel();
            }
        }
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        drag = null;
    });

    canvas.addEventListener('dblclick', e => {
        if (isSeq()) { if (!e.target.closest('[data-part]')) createParticipant('participant'); return; }
        if (e.target.closest('[data-node]')) return;
        const pt = toDiagram(e.clientX, e.clientY);
        const def = DIAGRAMS[diagramType()].nodes[0];
        createNode(def.kind, pt.x, pt.y);
    });

    /* ============================================================
     * Mutations
     * ============================================================ */
    function nodeById(id) { return state.nodes.find(n => n.id === id); }
    function edgeById(id) { return state.edges.find(e => e.id === id); }
    function itemCount() { return isSeq() ? (state.participants || []).length : state.nodes.length; }

    function nodeDefaults(kind) {
        switch (kind) {
            case 'class': return { name: 'NewClass', stereotype: '', attributes: ['- field: Type'], methods: ['+ method(): void'] };
            case 'state': return { name: 'State' };
            case 'initial': return { name: '' };
            case 'final': return { name: '' };
            case 'actor': return { name: 'Actor' };
            case 'usecase': return { name: 'UseCase' };
            case 'boundary': return { name: 'System', w: 280, h: 200 };
            case 'component': return { name: 'Component' };
            case 'interface': return { name: 'Interface' };
            case 'note': return { text: 'メモ' };
        }
        return { name: '' };
    }

    function createNode(kind, x, y) {
        commit();
        layoutNodeKindTmp.kind = kind; layoutNode(layoutNodeKindTmp);   // 既定サイズ取得
        const w = layoutNodeKindTmp.w, h = layoutNodeKindTmp.h;
        const n = Object.assign({ id: uid('n'), kind, x: Math.round(x - w / 2), y: Math.round(y - h / 2) }, nodeDefaults(kind));
        if (kind === 'boundary') { n.x = Math.round(x - n.w / 2); n.y = Math.round(y - n.h / 2); }
        state.nodes.push(n);
        // 境界は他ノードの背面へ（先頭に挿入）
        if (kind === 'boundary') { state.nodes.pop(); state.nodes.unshift(n); }
        setMode('select');
        select('node', n.id);
        render(); save();
        const f = $('f_text') || $('f_name'); if (f) { f.focus(); f.select(); }
    }
    const layoutNodeKindTmp = { name: '', attributes: [], methods: [] };

    function createEdge(from, to, type) {
        commit();
        const e = { id: uid('e'), from, to, type, fromMult: '', toMult: '', label: DEFAULT_EDGE_LABEL[type] || '' };
        state.edges.push(e);
        setMode('select');
        select('edge', e.id);
        render(); save();
        toast((REL[type] ? REL[type].label : '関連') + 'を追加しました');
    }

    function deleteSelection() {
        if (isSeq()) {
            if (!selection) return;
            commit();
            if (selection.kind === 'part') { state.participants = state.participants.filter(p => p.id !== selection.id); state.messages = state.messages.filter(m => m.from !== selection.id && m.to !== selection.id); }
            else if (selection.kind === 'frag') { state.fragments = (state.fragments || []).filter(f => f.id !== selection.id); }
            else if (selection.kind === 'snote') { state.notes = (state.notes || []).filter(n => n.id !== selection.id); }
            else state.messages = state.messages.filter(m => m.id !== selection.id);
            selection = null; render(); renderPanel(); save(); return;
        }
        if (!selection && !selNodes.size) return;
        commit();
        if (selNodes.size) {
            const ids = selNodes;
            state.nodes = state.nodes.filter(n => !ids.has(n.id));
            state.edges = state.edges.filter(e => !ids.has(e.from) && !ids.has(e.to));
            selNodes = new Set();
        } else if (selection.kind === 'edge') {
            state.edges = state.edges.filter(e => e.id !== selection.id);
        }
        select(null); render(); save();
    }

    /* ============================================================
     * 編集操作: 整列 / 複製 / コピペ / 自動レイアウト
     * ============================================================ */
    function selectedNodeList() { return state.nodes.filter(n => selNodes.has(n.id)); }

    function align(kind) {
        const ns = selectedNodeList(); if (ns.length < 2) return;
        commit();
        const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
        const rs = ns.map(n => n.x + n.w), bs = ns.map(n => n.y + n.h);
        const minX = Math.min(...xs), maxR = Math.max(...rs), minY = Math.min(...ys), maxB = Math.max(...bs);
        if (kind === 'left') ns.forEach(n => n.x = minX);
        else if (kind === 'right') ns.forEach(n => n.x = maxR - n.w);
        else if (kind === 'hcenter') { const c = (minX + maxR) / 2; ns.forEach(n => n.x = Math.round(c - n.w / 2)); }
        else if (kind === 'top') ns.forEach(n => n.y = minY);
        else if (kind === 'bottom') ns.forEach(n => n.y = maxB - n.h);
        else if (kind === 'vcenter') { const c = (minY + maxB) / 2; ns.forEach(n => n.y = Math.round(c - n.h / 2)); }
        else if (kind === 'hdist') {
            const sorted = [...ns].sort((a, b) => a.x - b.x);
            const left = sorted[0].x, right = sorted[sorted.length - 1].x;
            const gap = (right - left) / (sorted.length - 1);
            sorted.forEach((n, i) => n.x = Math.round(left + gap * i));
        } else if (kind === 'vdist') {
            const sorted = [...ns].sort((a, b) => a.y - b.y);
            const top = sorted[0].y, bot = sorted[sorted.length - 1].y;
            const gap = (bot - top) / (sorted.length - 1);
            sorted.forEach((n, i) => n.y = Math.round(top + gap * i));
        }
        render(); save();
    }

    function cloneNodes(ids, dx, dy) {
        const map = new Map();
        const newNodes = [...ids].map(id => {
            const o = nodeById(id); if (!o) return null;
            const c = JSON.parse(JSON.stringify(o));
            c.id = uid('n'); c.x = o.x + dx; c.y = o.y + dy;
            map.set(id, c.id); return c;
        }).filter(Boolean);
        // 両端とも選択内にある関連だけ複製
        const newEdges = state.edges.filter(e => map.has(e.from) && map.has(e.to))
            .map(e => Object.assign(JSON.parse(JSON.stringify(e)), { id: uid('e'), from: map.get(e.from), to: map.get(e.to) }));
        return { newNodes, newEdges };
    }

    function duplicateSelection() {
        const ids = selNodes.size ? [...selNodes] : (selection && selection.kind === 'node' ? [selection.id] : []);
        if (!ids.length) return;
        commit();
        const { newNodes, newEdges } = cloneNodes(ids, 24, 24);
        state.nodes.push(...newNodes); state.edges.push(...newEdges);
        selNodes = new Set(newNodes.map(n => n.id));
        selection = { kind: 'node', id: newNodes[newNodes.length - 1].id };
        render(); refreshSelectionStyles(); renderPanel(); save();
        toast(newNodes.length + '件を複製しました');
    }

    function copySelection() {
        const ids = selNodes.size ? [...selNodes] : (selection && selection.kind === 'node' ? [selection.id] : []);
        if (!ids.length) return;
        const { newNodes, newEdges } = cloneNodes(ids, 0, 0);
        clipboard = { nodes: newNodes, edges: newEdges };
        toast(ids.length + '件をコピーしました');
    }

    function pasteClipboard() {
        if (isSeq() || !clipboard) return;
        commit();
        const idmap = new Map();
        const ns = clipboard.nodes.map(o => { const c = JSON.parse(JSON.stringify(o)); const nid = uid('n'); idmap.set(o.id, nid); c.id = nid; c.x += 28; c.y += 28; return c; });
        const es = clipboard.edges.map(o => Object.assign(JSON.parse(JSON.stringify(o)), { id: uid('e'), from: idmap.get(o.from), to: idmap.get(o.to) }));
        state.nodes.push(...ns); state.edges.push(...es);
        // 次回ペーストでさらにずれるよう保持を更新
        clipboard = { nodes: ns.map(n => JSON.parse(JSON.stringify(n))), edges: es.map(e => JSON.parse(JSON.stringify(e))) };
        selNodes = new Set(ns.map(n => n.id));
        selection = { kind: 'node', id: ns[ns.length - 1].id };
        render(); refreshSelectionStyles(); renderPanel(); save();
        toast(ns.length + '件を貼り付けました');
    }

    // 有向関係でレイヤ化する簡易自動レイアウト（階層が無ければグリッド）
    function autoLayout() {
        if (isSeq()) { toast('シーケンス図は自動配置です'); return; }
        if (!state.nodes.length) return;
        commit();
        state.nodes.forEach(layoutNode);
        const level = new Map(state.nodes.map(n => [n.id, 0]));
        // 継承/実現は親(to)が上、その他は from が上
        const order = state.edges.map(e => (e.type === 'inheritance' || e.type === 'realization')
            ? { a: e.to, b: e.from } : { a: e.from, b: e.to }).filter(o => o.a !== o.b && level.has(o.a) && level.has(o.b));
        for (let it = 0; it <= state.nodes.length; it++) {
            let changed = false;
            for (const o of order) { const w = level.get(o.a) + 1; if (w > level.get(o.b)) { level.set(o.b, w); changed = true; } }
            if (!changed) break;
        }
        const rows = {};
        state.nodes.forEach(n => { (rows[level.get(n.id)] ||= []).push(n); });
        const levels = Object.keys(rows).map(Number).sort((a, b) => a - b);
        if (levels.length <= 1) {                         // グリッド
            const cols = Math.ceil(Math.sqrt(state.nodes.length));
            const HGAP = 50, VGAP = 50; let col = 0, colX = 40, rowY = 40, maxH = 0;
            state.nodes.forEach(n => {
                n.x = Math.round(colX); n.y = Math.round(rowY);
                colX += n.w + HGAP; maxH = Math.max(maxH, n.h); col++;
                if (col >= cols) { col = 0; colX = 40; rowY += maxH + VGAP; maxH = 0; }
            });
        } else {                                          // レイヤ
            const HGAP = 60, VGAP = 90; let y = 40;
            levels.forEach(lv => {
                const row = rows[lv];
                const totW = row.reduce((s, n) => s + n.w, 0) + HGAP * (row.length - 1);
                let x = Math.max(40, (900 - totW) / 2), maxH = 0;
                row.forEach(n => { n.x = Math.round(x); n.y = Math.round(y); x += n.w + HGAP; maxH = Math.max(maxH, n.h); });
                y += maxH + VGAP;
            });
        }
        render(); save(); fitView();
        toast('自動整列しました');
    }

    /* ============================================================
     * History (undo / redo)
     * ============================================================ */
    let history = [], future = [];
    function snap() { return JSON.stringify(state); }
    function commit() { history.push(snap()); if (history.length > 120) history.shift(); future = []; }
    function undo() {
        if (!history.length) return;
        future.push(snap()); state = JSON.parse(history.pop());
        selection = null; selNodes = new Set(); render(); renderPanel(); save();
    }
    function redo() {
        if (!future.length) return;
        history.push(snap()); state = JSON.parse(future.pop());
        selection = null; selNodes = new Set(); render(); renderPanel(); save();
    }
    $('undoBtn').onclick = undo;
    $('redoBtn').onclick = redo;

    /* ============================================================
     * Selection & properties panel
     * ============================================================ */
    function isSel(kind, id) { return selection && selection.kind === kind && selection.id === id; }
    function refreshSelectionStyles() {
        nodesLayer.querySelectorAll('.node').forEach(g => {
            const id = g.dataset.node;
            g.classList.toggle('selected', isSel('node', id));
            g.classList.toggle('multi', selNodes.has(id) && !isSel('node', id));
        });
        edgesLayer.querySelectorAll('.edge').forEach(g => g.classList.toggle('selected', isSel('edge', g.dataset.edge)));
    }
    function select(kind, id) {
        selection = kind ? { kind, id } : null;
        selNodes = kind === 'node' ? new Set([id]) : new Set();
        if (isSeq()) { renderSequence(); renderPanel(); return; }
        refreshSelectionStyles();
        renderPanel();
    }

    let editBaseline = null;
    const props = $('props');
    props.addEventListener('focusin', () => { editBaseline = snap(); });
    function recordEdit() { if (editBaseline) { history.push(editBaseline); if (history.length > 120) history.shift(); future = []; editBaseline = snap(); $('undoBtn').disabled = false; } }

    function renderPanel() {
